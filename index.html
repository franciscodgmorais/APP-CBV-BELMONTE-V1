<style>
:root{--red:#b5121b;--red2:#8f0c14;--ink:#20242a;--muted:#68717c;--paper:#f3f4f6;--white:#fff;--line:#e3e5e8;--shadow:0 8px 24px #161b2210}*{box-sizing:border-box}body{margin:0;background:#24272b;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(20,22,26,.58),rgba(20,22,26,.68)),url("frota-cbv-belmonte.jpg") center center/cover no-repeat;transform:translateZ(0)}button,input{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100dvh;background:transparent;padding-bottom:90px}.top{background:linear-gradient(110deg,rgba(117,0,10,.91),rgba(143,12,20,.80)),url('frota-cbv-belmonte.jpg') center 48%/cover;color:white;padding:calc(18px + env(safe-area-inset-top)) 20px 24px;border-radius:0 0 26px 26px;box-shadow:var(--shadow)}.topline{display:flex;align-items:center;gap:13px}.crest{width:112px;height:112px;display:grid;place-items:center;background:transparent;overflow:visible;flex-shrink:0}.crest img{width:100%;height:100%;object-fit:contain;padding:0;filter:drop-shadow(0 2px 4px #0006)}.brand{font-weight:900;letter-spacing:1.2px;font-size:21px;line-height:1.1}.subtitle{font-size:12px;opacity:.9;margin-top:5px}.top p{font-size:13px;opacity:.92;margin:19px 0 0}.content{padding:20px 16px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;font-weight:800;color:var(--red);margin:0 0 9px}.heading{font-size:23px;line-height:1.2;margin:0 0 7px;font-weight:850}.intro{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{background:white;border:1px solid var(--line);border-radius:18px;padding:17px 15px;text-align:left;min-height:140px;box-shadow:var(--shadow);color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;gap:9px}.tile:active,.rowbtn:active{transform:scale(.99)}.tile .ico{width:43px;height:43px;border-radius:13px;display:grid;place-items:center;background:#fff0f0;color:#b5121b;border:1px solid #f0c7ca}.tile .ico svg{stroke:#b5121b}.tile .ico svg{width:25px;height:25px}.tile strong{font-size:15px}.tile small{font-size:12px;color:var(--muted);line-height:1.35}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.back{border:1px solid var(--line);background:white;color:var(--ink);border-radius:12px;padding:10px 12px;font-weight:700}.search{width:100%;border:1px solid var(--line);border-radius:13px;background:white;padding:13px 14px;outline:none;margin:2px 0 14px}.search:focus{border-color:var(--red);box-shadow:0 0 0 3px #b5121b16}.list{display:grid;gap:10px}.rowbtn{border:1px solid var(--line);background:white;border-radius:15px;padding:14px;display:flex;align-items:center;gap:12px;text-align:left;color:var(--ink);width:100%;box-shadow:var(--shadow)}.num{width:42px;height:42px;flex-shrink:0;border-radius:13px;background:var(--red);color:white;font-weight:900;display:grid;place-items:center}.rowmain{flex:1;min-width:0}.rowmain strong{display:block;font-size:14px}.rowmain small{display:block;color:var(--muted);font-size:12px;margin-top:4px;line-height:1.35}.chev{color:var(--muted);font-size:22px}.mapwrap{background:white;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px}.maptools{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-size:13px;font-weight:750}.map{height:330px;width:100%;background:#e7e9eb}.compassbox{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}.compass{width:150px;height:150px;border-radius:50%;border:2px solid #d8dce1;position:relative;background:radial-gradient(circle,#fff 0 55%,#f4f5f7 56% 100%);margin:auto}.compass .needle{position:absolute;left:calc(50% - 2px);top:13px;width:4px;height:61px;background:var(--red);transform-origin:50% 62px;border-radius:4px}.compass .needle:after{content:"";position:absolute;bottom:-8px;left:-5px;border-left:7px solid transparent;border-right:7px solid transparent;border-top:12px solid #7b8794}.compass .north{position:absolute;top:4px;left:calc(50% - 7px);font-weight:900;color:var(--red)}.compass .south{position:absolute;bottom:4px;left:calc(50% - 7px);font-weight:800}.compass .east{position:absolute;right:7px;top:calc(50% - 10px);font-weight:800}.compass .west{position:absolute;left:7px;top:calc(50% - 10px);font-weight:800}.readout{font-size:13px;line-height:1.8}.readout strong{font-variant-numeric:tabular-nums}.positionbtn{width:100%;margin-bottom:12px}@media(max-width:400px){.compassbox{grid-template-columns:1fr}.compass{width:160px;height:160px}.crest{width:82px;height:82px}.brand{font-size:19px}}.mapnote{padding:10px 14px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow);margin-bottom:12px}.detailnum{display:inline-grid;place-items:center;background:#fff0f0;color:var(--red);font-weight:900;border-radius:12px;width:48px;height:48px;margin-bottom:12px}.detailtitle{font-size:21px;margin:0 0 6px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.coords{background:#f5f6f7;border-radius:12px;padding:12px;font-size:13px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;margin:13px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.primary,.secondary{border-radius:12px;padding:13px 12px;font-weight:800;border:0;text-align:center;text-decoration:none;display:flex;justify-content:center;align-items:center;gap:7px}.primary{background:var(--red);color:white}.secondary{background:#fff0f0;color:var(--red);border:1px solid #f0d2d4}.placeholder{background:white;border:1px dashed #c8cbd0;border-radius:18px;padding:23px;text-align:center}.placeholder .ico{margin:0 auto 12px}.placeholder p{color:var(--muted);font-size:13px;line-height:1.5}.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:500}.bottominner{width:100%;max-width:720px;display:flex;gap:8px}.navbtn{flex:1;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:750;padding:7px 4px;border-radius:12px;display:grid;justify-items:center;gap:4px}.navbtn svg{width:21px;height:21px}.navbtn.active{color:var(--red);background:#fff0f0}.toast{position:fixed;left:20px;right:20px;bottom:90px;background:#20242a;color:white;border-radius:12px;padding:12px 14px;font-size:13px;display:none;z-index:999}.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}.leaflet-popup-content-wrapper{border-radius:12px}.leaflet-popup-content{font-family:system-ui,sans-serif;line-height:1.5}@media(min-width:600px){.content{padding:24px}.top{padding-left:26px;padding-right:26px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.map{height:410px}}

/* Contraste reforçado para leitura sobre a fotografia de fundo */
.content{background:rgba(16,18,22,.34);color:#fff;min-height:55vh}
.content .eyebrow{color:#ffd2d5;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.content .heading{color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.55)}
.content .intro{color:#f5f5f5;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.content .sectionhead .heading{color:#fff}
/* O texto operacional permanece em cartões claros para máxima legibilidade */
.content .tile,.content .rowbtn,.content .card,.content .mapwrap,.content .placeholder,.content .back,.content .search{color:var(--ink);background-color:#fff}
.content .tile small,.content .rowmain small,.content .muted,.content .mapnote,.content .placeholder p{color:#59616b}
.content .maptools{color:var(--ink)}
.content .coords{color:#20242a;background:#eef0f2}
@media(max-width:400px){.content{padding:18px 12px}}
</style>

</div><nav class="bottom"><div class="bottominner"><button class="navbtn active" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1Z"/></svg>Início</button><button class="navbtn" data-nav="hydrants"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 21V9a5 5 0 0 1 10 0v12M5 12h14M9 4V2h6v2M4 16H2m20 0h-2"/></svg>Hidrantes</button><button class="navbtn" data-nav="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Z"/><path d="M9 3v15m6-12v15"/></svg>Mapa</button></div></nav><div class="toast" id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const points=[
{id:1,name:'EM 571',lat:40.369111,lon:-7.332749},
{id:2,name:'Quinta da Ribeira',lat:40.341720,lon:-7.323897},
{id:3,name:'EM 563',lat:40.337889,lon:-7.291794},
{id:4,name:'EM 1051 — Quinta das Pereiras',lat:40.330615,lon:-7.377719},
{id:5,name:'EM 1051 — Malpique',lat:40.313732,lon:-7.362837},
{id:6,name:'EN 18-3',lat:40.310179,lon:-7.316784},
{id:7,name:'EM 570',lat:40.279867,lon:-7.339817}
];
const content=document.getElementById('content');let currentMap=null;let currentView='home';let selectedPoint=null;let query='';
const icons={location:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>',ambulance:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h11v11H3zM14 11h4l3 3v4h-7z"/><path d="M7 10h4m-2-2v4"/><circle cx="7" cy="19" r="2"/><circle cx="18" cy="19" r="2"/></svg>',phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 11.2 19a19.4 19.4 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7l.5 2.8a2 2 0 0 1-.6 1.9L7.1 10.3a16 16 0 0 0 6.6 6.6l1.9-1.9a2 2 0 0 1 1.9-.6l2.8.5a2 2 0 0 1 1.7 2z"/></svg>',hydrants:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 21V9a5 5 0 0 1 10 0v12M5 12h14M9 4V2h6v2M4 16H2m20 0h-2"/></svg>',truck:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h11v12H3zM14 10h4l3 4v4h-7z"/><circle cx="7" cy="19" r="2"/><circle cx="18" cy="19" r="2"/></svg>',map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Z"/><path d="M9 3v15m6-12v15"/></svg>',gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.6a8 8 0 0 1-1.8 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.8-1l-1.7.6-1.4-2.4L7.1 15a8 8 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.6a8 8 0 0 1 1.8-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.8 1l1.7-.6 1.4 2.4-1.4 1.1a8 8 0 0 1-.1 2Z" transform="translate(-1 -1)"/></svg>',chevron:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>'};
function tile(title,desc,icon,action){return `<button class="tile" data-action="${action}"><span class="ico">${icons[icon]||icons.gear}</span><strong>${title}</strong><small>${desc}</small></button>`}
function setActive(nav){document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.nav===nav))}
function home(){currentView='home';setActive('home');content.innerHTML=`<p class="eyebrow">Painel principal</p><h1 class="heading">Bem-vindo à aplicação</h1><p class="intro">Acede rapidamente aos recursos de apoio operacional dos Bombeiros do Concelho de Belmonte.</p><div class="grid">${tile('Minha posição','Coordenadas GPS, UTM e bússola','location','position')}${tile('Hidrantes','Rede de regadio e rede urbana','hydrants','hydrants')}${tile('Viaturas','Frota e informação operacional','truck','vehicles')}${tile('Cartografia','Mapas e informação territorial','map','cartography')}${tile('Equipamentos','Consulta de equipamentos','gear','equipment')}${tile('Emergência Pré-Hospitalar','Adulto, pediátrico e hospitais de evacuação','ambulance','eph')}${tile('Contactos Úteis','CODU, CDOS e Bombeiros','phone','contacts')}</div><div class="card" style="margin-top:16px"><p class="eyebrow">Disponível nesta versão</p><strong>Rede de Regadio</strong><p class="muted" style="margin-bottom:0">7 hidrantes registados, com coordenadas e acesso à navegação. As restantes secções ficam preparadas para acrescentar conteúdo.</p></div>`}
function hydrants(){currentView='hydrants';setActive('hydrants');content.innerHTML=`<div class="sectionhead"><div><p class="eyebrow">Hidrantes</p><h1 class="heading">Escolher rede</h1></div><div style="display:flex;gap:6px"><button class="back" data-action="back">Voltar</button><button class="back" data-action="home">Início</button></div></div><p class="intro">Seleciona a rede que pretendes consultar.</p><div class="grid">${tile('Rede de Regadio','7 hidrantes com localização','hydrants','list')}${tile('Hidrantes Urbanos','Preparado para adicionar pontos','hydrants','urban')}</div>`}
function pointRows(){let filtered=points.filter(p=>(`hidrante ${p.id} ${p.name}`).toLowerCase().includes(query.toLowerCase()));return filtered.length?filtered.map(p=>`<button class="rowbtn" data-point="${p.id}"><span class="num">${p.id}</span><span class="rowmain"><strong>Hidrante ${p.id} — ${p.name}</strong><small>${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}</small></span><span class="chev">›</span></button>`).join(''):'<div class="empty">Não foram encontrados hidrantes.</div>'}
function list(){currentView='list';setActive('hydrants');content.innerHTML=`<div class="sectionhead"><div><p class="eyebrow">Hidrantes / Rede de Regadio</p><h1 class="heading">7 pontos registados</h1></div><div style="display:flex;gap:6px"><button class="back" data-action="back">Voltar</button><button class="back" data-action="home">Início</button></div></div><input class="search" id="search" placeholder="Pesquisar por número ou local…" value="${escapeHtml(query)}" aria-label="Pesquisar hidrantes"><div class="list" id="pointlist">${pointRows()}</div>`;document.getElementById('search').addEventListener('input',e=>{query=e.target.value;document.getElementById('pointlist').innerHTML=pointRows()})}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function detail(id){const p=points.find(x=>x.id===Number(id));if(!p)return;selectedPoint=p;currentView='detail';setActive('hydrants');const gmaps=`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}`;const apple=`https://maps.apple.com/?daddr=${p.lat},${p.lon}`;content.innerHTML=`<div class="sectionhead"><div><p class="eyebrow">Rede de Regadio</p><h1 class="heading">Ficha do hidrante</h1></div><div style="display:flex;gap:6px"><button class="back" data-action="back">Voltar</button><button class="back" data-action="home">Início</button></div></div><div class="card"><span class="detailnum">${p.id}</span><h2 class="detailtitle">Hidrante ${p.id}</h2><p class="muted" style="margin:0">${escapeHtml(p.name)}</p><div class="coords"><strong>Latitude:</strong> ${p.lat.toFixed(6)}<br><strong>Longitude:</strong> ${p.lon.toFixed(6)}</div><div class="actions"><a class="primary" href="${gmaps}" target="_blank" rel="noopener">Abrir navegação ↗</a><button class="secondary" data-copy="${p.lat}, ${p.lon}">Copiar coordenadas</button></div><p class="muted" style="margin:14px 0 0">Confirma sempre a localização e as condições de acesso no terreno.</p></div><div class="card"><strong>Localização no mapa</strong><div id="detailmap" class="map" style="margin-top:12px;border-radius:12px"></div></div>`;setTimeout(()=>makeMap('detailmap',[p],14),60)}
function makeMap(elementId,data,zoom){const el=document.getElementById(elementId);if(!el)return;if(currentMap){currentMap.remove();currentMap=null}if(typeof L==='undefined'){el.innerHTML='<div class="empty">Não foi possível carregar o mapa. Verifica a ligação à Internet.</div>';return}const map=L.map(el).setView([40.335,-7.335],zoom||11);currentMap=map;L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);data.forEach(p=>{const nav=`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}&travelmode=driving`;L.marker([p.lat,p.lon]).addTo(map).bindPopup(`<strong>Hidrante ${p.id}</strong><br>${escapeHtml(p.name)}<br><a target="_blank" rel="noopener" href="${nav}">Navegar até aqui</a><br><button type="button" data-point="${p.id}">Ver ficha do hidrante</button>`)});if(data.length>1)map.fitBounds(data.map(p=>[p.lat,p.lon]),{padding:[24,24]});setTimeout(()=>map.invalidateSize(),150)}
function mapView(){currentView='map';setActive('map');content.innerHTML=`<div class="sectionhead"><div><p class="eyebrow">Cartografia</p><h1 class="heading">Rede de Regadio</h1></div><button class="back" data-action="list">Ver lista</button></div><p class="intro">Consulta a localização dos sete hidrantes. Seleciona um marcador para abrir a respetiva ficha.</p><div class="mapwrap"><div class="maptools"><span>7 hidrantes no mapa</span><button class="back" data-action="list">Lista</button></div><div id="mainmap" class="map"></div><div class="mapnote">Mapa base OpenStreetMap; podes escolher imagem de satélite nas opções. Requer ligação à Internet.</div></div><div class="list">${points.slice(0,3).map(p=>`<button class="rowbtn" data-point="${p.id}"><span class="num">${p.id}</span><span class="rowmain"><strong>Hidrante ${p.id} — ${escapeHtml(p.name)}</strong><small>Ver coordenadas e navegar</small></span><span class="chev">›</span></button>`).join('')}<button class="secondary" data-action="list">Ver todos os hidrantes</button></div>`;setTimeout(()=>makeMap('mainmap',points,11),60)}
let cartoMap=null,cartoLayers={},baseStreet=null,baseSatellite=null;
function cartography(){currentView='cartography';setActive('');content.innerHTML=`<div class="sectionhead"><div><p class="eyebrow">Cartografia operacional</p><h1 class="heading">Concelho de Belmonte</h1></div><div style="display:flex;gap:6px"><button class="back" data-action="back">Voltar</button><button class="back" data-action="home">Início</button></div></div><p class="intro">Mapa de trabalho com camadas independentes, nomes e acesso à navegação. Toca nos recursos para ver detalhes e abrir o Google Maps.</p><div class="card" style="padding:13px"><strong>Camadas do mapa</strong><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;font-size:13px"><label><input type="checkbox" data-layer="hydrants" checked> Hidrantes do Regadio (7)</label><label><input type="checkbox" data-layer="urban"> Hidrantes Urbanos (por georreferenciar)</label><label><input type="checkbox" data-layer="railway" checked> Linha ferroviária</label><label><input type="checkbox" data-layer="stations" checked> Estações e passagens</label><label><input type="checkbox" data-layer="motorway" checked> Autoestrada A23</label><label><input type="checkbox" data-layer="junctions" checked> Nós de acesso à A23</label><label><input type="checkbox" data-layer="boundaries" checked> Limites de freguesia</label><label><input type="checkbox" data-layer="roadimage" checked> Rede de estradas (traçado da imagem)</label><label><input type="checkbox" data-layer="myposition" checked> Minha posição GPS</label><label><input type="checkbox" data-layer="satellite"> Imagem de satélite</label></div><p id="cartostatus" class="muted" style="margin:12px 0 0">A carregar mapa, A23, ferrovia e pontos de acesso…</p></div><div class="mapwrap"><div class="maptools"><span>Belmonte — mapa operacional</span><button class="back" data-action="zoomall">Ver concelho</button></div><div id="cartoloading" class="mapnote">A carregar A23, incluindo o nó 34 de Benespera, e ferrovia…</div><div id="cartomap" class="map" style="height:430px"></div><div class="mapnote">Base cartográfica © OpenStreetMap contributors. Requer Internet. A23/ferrovia são consultadas uma vez e guardadas em cache local até 7 dias. Não utilizar como cartografia operacional certificada sem validação no terreno.</div></div><div class="card"><strong>PK de referência — nós da A23</strong><p class="muted">Valores transcritos da imagem fornecida. A entrada/saída e o sentido de circulação ficam por confirmar documentalmente; não são presumidos. Os dados são locais e aparecem sem esperar pela consulta cartográfica.</p><div class="list">${[['(34) Benespera','199,2','199,7'],['(33) Maçainhas','190,1','190,6'],['(32) Caria','181,7','182,1'],['(31) Covilhã Norte','172,6','172,9']].map(n=>`<div class="rowbtn"><span class="num">${n[0].match(/\d+/)[0]}</span><span class="rowmain"><strong>${n[0]}</strong><small>PK ${n[1]} · PK ${n[2]}<br>Entrada/saída e sentido: por confirmar documentalmente</small><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('Nó '+n[0]+' A23 Portugal')}">Pesquisar localização do nó no Google Maps</a></span></div>`).join('')}</div></div><div class="card"><strong>Legenda e validação</strong><p class="muted">Símbolos coloridos por tipo de recurso. A rede de estradas foi traçada a partir da imagem enviada e é aproximada; confirmar alinhamentos e quilometragens no terreno antes de uso operacional. Os limites de freguesia e os acessos devem ser confirmados com cartografia oficial e fontes das entidades responsáveis.</p><button class="secondary" data-action="list">Consultar os 7 hidrantes</button></div>`;setTimeout(initCartography,100)}

  const url='https://infogeo.dgterritorio.gov.pt/arcgis/rest/services/Hosted/Freguesias_CAOP_Continente/FeatureServer/0/query?where='+encodeURIComponent("concelho='Belmonte'")+'&outFields=freguesia,concelho,dicofre&returnGeometry=true&outSR=4326&f=geojson';
  const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),7000);const r=await fetch(url,{signal:controller.signal});clearTimeout(timer);if(!r.ok)throw Error('Serviço de limites indisponível');const geo=await r.json();
  if(!geo.features||!geo.features.length)throw Error('O serviço não devolveu freguesias de Belmonte');
  drawBoundaries(geo);try{localStorage.setItem('cbv_belmonte_boundaries_v1',JSON.stringify(geo))}catch(e){}
  const status2=document.getElementById('cartostatus');if(status2)status2.textContent='Limites administrativos recebidos da DGT. Toca numa freguesia para ver o nome.';
  // Manter o centro inicial do mapa; evitar saltos de enquadramento no telemóvel.
 }catch(err){console.warn('Limites CAOP:',err);if(status)status.textContent='Não foi possível obter os limites oficiais agora. Verifica a ligação e tenta novamente; as restantes camadas continuam disponíveis.';}
}

let cartoFeaturesLoading=false,cartoFeaturesLoaded=false;

 const cacheKey='cbv_belmonte_overpass_v4',cacheMaxAge=7*24*60*60*1000;

 if(!elements){for(const endpoint of endpoints){try{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),6000);const response=await fetch(endpoint+'?data='+encodeURIComponent(query),{signal:controller.signal});clearTimeout(timer);if(!response.ok)throw Error('HTTP '+response.status);const json=await response.json();if(!Array.isArray(json.elements))throw Error('Resposta cartográfica inválida');elements=json.elements;try{localStorage.setItem(cacheKey,JSON.stringify({savedAt:Date.now(),elements}))}catch(e){}break}catch(e){lastError=e;console.warn('Overpass indisponível',endpoint,e)}}}
 if(!elements){cartoFeaturesLoading=false;if(status)status.textContent='Não foi possível obter A23/ferrovia (serviços cartográficos indisponíveis). Os hidrantes e os limites em cache continuam disponíveis. Tenta novamente mais tarde.';return}
 const counts={motorway:0,railway:0,stations:0,junctions:0};const seen=new Set();
 for(const e of elements){const tags=e.tags||{};let lat=e.lat,lon=e.lon;if((!Number.isFinite(lat)||!Number.isFinite(lon))&&e.center){lat=e.center.lat;lon=e.center.lon}
  if(e.type==='way'&&Array.isArray(e.geometry)&&e.geometry.length>1&&((tags.highway==='motorway')||(tags.highway==='trunk'&&/A23/.test(tags.ref||''))||(/A23/.test(tags.ref||'')&&tags.highway))){

  }

}
function positionView(){currentView='position';setActive('');content.innerHTML=`<div class="sectionhead"><div><p class="eyebrow">Orientação no terreno</p><h1 class="heading">Minha posição</h1></div><div style="display:flex;gap:6px"><button class="back" data-action="back">Voltar</button><button class="back" data-action="home">Início</button></div></div><p class="intro">Obtém a posição do dispositivo, as coordenadas geográficas e UTM, a via/localidade reconhecida e a orientação da bússola. O PK e o sentido de circulação só são apresentados quando existirem dados fiáveis.</p><button class="primary positionbtn" data-action="getposition">⌖ Obter / atualizar minha posição</button><div class="card"><strong>Coordenadas atuais</strong><div id="positionstatus" class="muted" style="margin-top:8px">Ainda não foi obtida uma posição. Permite o acesso à localização quando o navegador perguntar.</div><div id="positioncoords" class="coords" style="display:none"></div><div id="roadinfo" class="coords" style="display:none"><strong>Via/localidade:</strong> a identificar…</div><div class="actions"><button class="secondary" data-action="copygps">Copiar coordenadas</button><button class="secondary" data-action="sharegps">Partilhar localização</button><button class="secondary" data-action="navigatecurrent">Abrir no mapa</button></div></div><div class="card"><strong>Bússola</strong><p class="muted">Em iPhone, carrega em ativar e autoriza o acesso aos sensores, se solicitado. Mantém o dispositivo na horizontal.</p><div class="compassbox"><div class="compass" aria-label="Bússola"><span class="north">N</span><span class="east">E</span><span class="south">S</span><span class="west">O</span><div id="compassneedle" class="needle"></div></div><div class="readout"><div>Direção: <strong id="headingvalue">—°</strong></div><div>Ponto cardeal: <strong id="cardinalvalue">—</strong></div><div class="muted" id="compassstatus">Bússola ainda não ativada.</div></div></div><button class="secondary positionbtn" style="margin-top:14px" data-action="compass">Ativar bússola</button></div><p class="muted">A localização e a bússola dependem do equipamento, das permissões e do navegador. Em alguns dispositivos, a orientação pode não estar disponível. As coordenadas UTM são calculadas para WGS84, zona 29N, adequada à região de Belmonte; se estiveres fora dessa zona, a zona será ajustada automaticamente.</p>`;getPosition()}

function toUTM(lat,lon){const a=6378137,e=0.08181919084262149,k0=.9996;const zone=Math.floor((lon+180)/6)+1;const lon0=((zone-1)*6-180+3)*Math.PI/180;const latR=lat*Math.PI/180,lonR=lon*Math.PI/180;const ep2=e*e/(1-e*e),N=a/Math.sqrt(1-e*e*Math.sin(latR)**2),T=Math.tan(latR)**2,C=ep2*Math.cos(latR)**2,A=Math.cos(latR)*(lonR-lon0);const M=a*((1-e*e/4-3*e**4/64-5*e**6/256)*latR-(3*e*e/8+3*e**4/32+45*e**6/1024)*Math.sin(2*latR)+(15*e**4/256+45*e**6/1024)*Math.sin(4*latR)-(35*e**6/3072)*Math.sin(6*latR));const E=500000+k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120);let north=k0*(M+N*Math.tan(latR)*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720));if(lat<0)north+=10000000;return {zone,band:'CDEFGHJKLMNPQRSTUVWXX'[Math.floor((lat+80)/8)],easting:Math.round(E),northing:Math.round(north)}}
function toDMS(value,isLat){const hemi=value<0?(isLat?'S':'W'):(isLat?'N':'E');const abs=Math.abs(value);const deg=Math.floor(abs);const minFloat=(abs-deg)*60;const min=Math.floor(minFloat);const sec=((minFloat-min)*60).toFixed(2).padStart(5,'0');return `${String(deg).padStart(isLat?2:3,'0')}° ${String(min).padStart(2,'0')}′ ${sec}″ ${hemi}`}
function getPosition(){const st=document.getElementById('positionstatus');if(!navigator.geolocation){if(st)st.textContent='Este navegador não disponibiliza geolocalização.';return}if(st)st.textContent='A obter posição GPS…';navigator.geolocation.getCurrentPosition(pos=>{currentPosition={lat:pos.coords.latitude,lon:pos.coords.longitude,accuracy:pos.coords.accuracy};const u=toUTM(currentPosition.lat,currentPosition.lon);const box=document.getElementById('positioncoords');if(box){box.style.display='block';box.innerHTML=`<strong>Latitude:</strong> ${toDMS(currentPosition.lat,true)}<br><strong>Longitude:</strong> ${toDMS(currentPosition.lon,false)}<br><strong>Precisão estimada:</strong> ±${Math.round(currentPosition.accuracy)} m<br><hr style="border:0;border-top:1px solid #ddd"><strong>Decimal:</strong> ${currentPosition.lat.toFixed(6)}, ${currentPosition.lon.toFixed(6)}<br><strong>UTM:</strong> Zona ${u.zone}${u.band}<br><strong>Este (E):</strong> ${u.easting} m<br><strong>Norte (N):</strong> ${u.northing} m<br><strong>Referencial:</strong> WGS84`};if(st)st.textContent='Posição obtida. Confirma a precisão indicada antes de usar no terreno.';identifyRoad(currentPosition.lat,currentPosition.lon)},err=>{if(st)st.textContent=err.code===1?'Permissão de localização recusada. Ativa-a nas definições do navegador/dispositivo.':err.code===2?'Posição indisponível. Tenta num local com melhor sinal GPS.':'O pedido de localização demorou demasiado. Tenta novamente.'},{enableHighAccuracy:true,timeout:20000,maximumAge:5000})}
async function identifyRoad(lat,lon){const box=document.getElementById('roadinfo');if(!box)return;box.style.display='block';box.innerHTML='<strong>Via/localidade:</strong> a identificar…';try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`,{headers:{'Accept':'application/json'}});if(!r.ok)throw Error('indisponível');const d=await r.json(),a=d.address||{};const road=a.road||a.pedestrian||a.path||a.highway||a.footway||'Via não identificada';const place=a.village||a.hamlet||a.town||a.city||a.suburb||a.neighbourhood||a.municipality||'Localidade não identificada';const ref=a.ref?` · referência ${escapeHtml(a.ref)}`:'';const roadLabel=(/\bA ?23\b/i.test(road+' '+(a.ref||''))?'A23':/\bA ?25\b/i.test(road+' '+(a.ref||''))?'A25':escapeHtml(road));box.innerHTML=`<strong>Via:</strong> ${roadLabel}${ref}<br><strong>Localidade:</strong> ${escapeHtml(place)}<br><strong>PK:</strong> não disponível com fiabilidade nesta fonte<br><strong>Sentido de circulação:</strong> não confirmado pelo GPS`; }catch(e){box.innerHTML='<strong>Via/localidade:</strong> não foi possível identificar (verifica a ligação à Internet).<br><strong>Quilómetro/sentido:</strong> não confirmado automaticamente';}}
function cardinal(deg){return ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'][Math.round(deg/22.5)%16]}
async function enableCompass(){const st=document.getElementById('compassstatus');try{if(typeof DeviceOrientationEvent==='undefined'){if(st)st.textContent='Este dispositivo/navegador não disponibiliza a bússola.';return}if(typeof DeviceOrientationEvent.requestPermission==='function'){const permission=await DeviceOrientationEvent.requestPermission();if(permission!=='granted'){if(st)st.textContent='Acesso aos sensores não autorizado.';return}}if(!compassListening){window.addEventListener('deviceorientationabsolute',orientationUpdate,true);window.addEventListener('deviceorientation',orientationUpdate,true);compassListening=true}if(st)st.textContent='À espera da orientação do dispositivo…'}catch(e){if(st)st.textContent='Não foi possível ativar a bússola. Verifica as permissões e tenta novamente.'}}
function orientationUpdate(e){let h;if(typeof e.webkitCompassHeading==='number')h=e.webkitCompassHeading;else if(typeof e.alpha==='number')h=(360-e.alpha)%360;else return;h=(h+360)%360;const needle=document.getElementById('compassneedle'),hv=document.getElementById('headingvalue'),cv=document.getElementById('cardinalvalue'),st=document.getElementById('compassstatus');if(needle)needle.style.transform=`rotate(${h}deg)`;if(hv)hv.textContent=`${Math.round(h)}°`;if(cv)cv.textContent=cardinal(h);if(st)st.textContent='Orientação do dispositivo ativa.'}

function ephHome(){currentView='eph';setActive('');content.innerHTML=`<div class="sectionhead"><div><p class="eyebrow">Emergência Pré-Hospitalar</p><h1 class="heading">Emergência Pré-Hospitalar</h1></div><div style="display:flex;gap:6px"><button class="back" data-action="back">Voltar</button><button class="back" data-action="home">Início</button></div></div><p class="intro">Escolhe a área de consulta.</p><div class="grid">${tile('Adulto','Área de apoio pré-hospitalar adulto','gear','ephadult')}${tile('Pediátrico','Área de apoio pré-hospitalar pediátrico','gear','ephped')}${tile('Hospitais de Evacuação','Distância rodoviária e navegação','map','ephhospitals')}</div><p class="muted" style="margin-top:14px">Ferramenta de apoio. A escolha do destino deve respeitar a orientação do CODU e os critérios de encaminhamento aplicáveis.</p>`}
function ephHospitalsView(){currentView='ephhospitals';setActive('');content.innerHTML=`<div class="sectionhead"><div><p class="eyebrow">Emergência Pré-Hospitalar</p><h1 class="heading">Hospitais de Evacuação</h1></div><button class="back" data-action="eph">Voltar</button></div><p class="intro">Distâncias rodoviárias estimadas a partir da posição GPS atual. Seleciona um hospital para abrir o Google Maps com a rota de condução.</p><button class="primary positionbtn" data-action="refreshhospitals">⌖ Atualizar posição e distâncias</button><div id="hospitalstatus" class="muted" style="margin-bottom:12px">A obter posição GPS…</div><div id="hospitallist" class="list">${ephHospitals.map((h,i)=>`<button class="rowbtn" data-hospital="${i}"><span class="num">${i+1}</span><span class="rowmain"><strong>${h.name}</strong><small id="hospitaldistance${i}">A calcular distância rodoviária…</small></span><span class="chev">›</span></button>`).join('')}</div><p class="muted" style="margin-top:14px">As distâncias são calculadas por um serviço de rotas online e podem variar. O Google Maps seleciona a melhor rota disponível, incluindo autoestradas e portagens quando forem adequadas. Requer GPS e Internet.</p>`;refreshHospitalDistances()}
function openHospital(index){const h=ephHospitals[index];if(!h)return;const url=`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(h.address)}&travelmode=driving`;window.open(url,'_blank','noopener')}
function refreshHospitalDistances(){const status=document.getElementById('hospitalstatus');if(!navigator.geolocation){if(status)status.textContent='Este navegador não disponibiliza GPS.';return}if(status)status.textContent='A obter posição GPS…';navigator.geolocation.getCurrentPosition(async pos=>{const {latitude:lat,longitude:lon}=pos.coords;if(status)status.textContent=`Posição obtida (precisão aproximada ±${Math.round(pos.coords.accuracy)} m). A calcular rotas…`;await Promise.all(ephHospitals.map(async(h,i)=>{const el=document.getElementById('hospitaldistance'+i);if(!el)return;try{const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${lon},${lat};${h.lon},${h.lat}?overview=false`);if(!r.ok)throw Error();const d=await r.json();if(d.code!=='Ok'||!d.routes?.length)throw Error();el.textContent=`${(d.routes[0].distance/1000).toFixed(1).replace('.',',')} km por estrada · tocar para navegar`}catch(e){el.textContent='Distância indisponível · tocar para abrir Google Maps'}}));if(status)status.textContent='Distâncias rodoviárias estimadas; confirma sempre a rota no Google Maps.'},err=>{if(status)status.textContent=err.code===1?'Permite a localização nas definições para calcular as distâncias.':'Não foi possível obter GPS. Tenta atualizar a posição.'},{enableHighAccuracy:true,timeout:20000,maximumAge:10000})}

function contactsView(){currentView='contacts';setActive('');const contacts=[['Bombeiros do Concelho de Belmonte','275910090'],['CODU — Dados','800203264'],['CODU — Triagem','800500117'],['CDOS da Guarda','271210820'],['CDOS de Castelo Branco','272337733']];content.innerHTML=`<div class="sectionhead"><div><p class="eyebrow">Apoio operacional</p><h1 class="heading">Contactos Úteis</h1></div><div style="display:flex;gap:6px"><button class="back" data-action="back">Voltar</button><div style="display:flex;gap:6px"><button class="back" data-action="back">Voltar</button><button class="back" data-action="home">Início</button></div></div></div><p class="intro">Contactos rápidos para uso operacional. Confirma periodicamente os números junto das entidades responsáveis.</p><div class="list">${contacts.map((c,i)=>`<div class="rowbtn"><span class="num">${icons.phone}</span><span class="rowmain"><strong>${c[0]}</strong><small>${c[1]}</small></span><a class="primary" style="padding:10px" href="tel:${c[1]}">Ligar</a><button class="secondary" data-copy="${c[1]}">Copiar</button></div>`).join('')}</div><p class="muted" style="margin-top:12px">Número do CDOS de Castelo Branco atualizado conforme confirmação: 272 337 733.</p>`}
const parentView={detail:'list',list:'hydrants',hydrants:'home',map:'cartography',cartography:'home',position:'home',eph:'home',ephhospitals:'eph',contacts:'home',placeholder:'home'};
function goBack(){const target=parentView[currentView]||'home';if(target==='home')home();else if(target==='hydrants')hydrants();else if(target==='list')list();else if(target==='cartography')cartography();else if(target==='eph')ephHome();else home()}

function placeholder(title,desc){currentView='placeholder';setActive('');content.innerHTML=`<div class="sectionhead"><div><p class="eyebrow">Módulo</p><h1 class="heading">${title}</h1></div><div style="display:flex;gap:6px"><button class="back" data-action="back">Voltar</button><button class="back" data-action="home">Início</button></div></div><div class="placeholder"><div class="ico" style="width:48px;height:48px;border-radius:14px;background:#fff0f0;color:var(--red);display:grid;place-items:center">${icons.gear}</div><strong>${title}</strong><p>${desc}</p><p>Esta secção está preparada para receber informação numa próxima atualização.</p><button class="primary" style="margin:auto" data-action="home">Voltar ao início</button></div>`}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.style.display='block';setTimeout(()=>el.style.display='none',2200)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){const a=b.dataset.action;if(a==='home')home();if(a==='back')goBack();if(a==='contacts')contactsView();if(a==='eph')ephHome();if(a==='ephhospitals')ephHospitalsView();if(a==='ephadult')placeholder('Emergência Pré-Hospitalar — Adulto','Área reservada para protocolos e ferramentas de apoio à avaliação do adulto. O conteúdo clínico será acrescentado e validado numa próxima fase.');if(a==='ephped')placeholder('Emergência Pré-Hospitalar — Pediátrico','Área reservada para avaliação e protocolos pediátricos. O conteúdo clínico será acrescentado e validado numa próxima fase.');if(a==='refreshhospitals')refreshHospitalDistances();if(a==='position')positionView();if(a==='getposition')getPosition();if(a==='compass')enableCompass();if(a==='copygps'){if(currentPosition){const u=toUTM(currentPosition.lat,currentPosition.lon);const txt=`Lat ${toDMS(currentPosition.lat,true)}, Lon ${toDMS(currentPosition.lon,false)} | Decimal ${currentPosition.lat.toFixed(6)}, ${currentPosition.lon.toFixed(6)} | UTM ${u.zone}${u.band} E ${u.easting} N ${u.northing}`;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>toast('Coordenadas copiadas.')).catch(()=>toast(txt));else toast(txt)}else toast('Obtém primeiro a tua posição.')}if(a==='sharegps'){if(!currentPosition){toast('Obtém primeiro a tua posição.');getPosition()}else{const u=toUTM(currentPosition.lat,currentPosition.lon);const txt=`Minha posição CBV BELMONTE\nLatitude: ${toDMS(currentPosition.lat,true)}\nLongitude: ${toDMS(currentPosition.lon,false)}\nDecimal: ${currentPosition.lat.toFixed(6)}, ${currentPosition.lon.toFixed(6)}\nUTM: Zona ${u.zone}${u.band} E ${u.easting} m N ${u.northing} m\nGoogle Maps: https://www.google.com/maps?q=${currentPosition.lat},${currentPosition.lon}`;if(navigator.share)navigator.share({title:'Minha posição — CBV BELMONTE',text:txt}).catch(()=>{});else if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>toast('Localização copiada para partilhar.')).catch(()=>toast(txt));else toast(txt)}}if(a==='navigatecurrent'){if(currentPosition)window.open(`https://www.google.com/maps?q=${currentPosition.lat},${currentPosition.lon}`,'_blank','noopener');else toast('Obtém primeiro a tua posição.')}if(a==='hydrants')hydrants();if(a==='list')list();if(a==='map')mapView();if(a==='urban')placeholder('Hidrantes Urbanos','A lista de hidrantes urbanos será adicionada quando os dados estiverem disponíveis.');if(a==='vehicles')placeholder('Viaturas','Fichas de viaturas, fotografias, características e informação operacional.');if(a==='cartography')cartography();if(a==='zoomall'&&cartoMap)cartoMap.setView([40.335,-7.335],11);if(a==='equipment')placeholder('Equipamentos','Consulta de equipamentos e respetiva informação operacional.');return}const h=e.target.closest('[data-hospital]');if(h){openHospital(Number(h.dataset.hospital));return}const p=e.target.closest('[data-point]');if(p){detail(p.dataset.point);return}const c=e.target.closest('[data-copy]');if(c){const value=c.dataset.copy;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(value).then(()=>toast('Coordenadas copiadas.')).catch(()=>toast(value));else toast(value)}});
document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.nav==='home')home();if(b.dataset.nav==='hydrants')hydrants();if(b.dataset.nav==='map')mapView()}));window.addEventListener('open-point',e=>detail(e.detail));home();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
