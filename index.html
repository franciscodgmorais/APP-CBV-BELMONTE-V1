function cartography(){currentView='cartography';setActive('map');content.innerHTML=`<div class="sectionhead"><div><p class="eyebrow">Cartografia operacional</p><h1 class="heading">Concelho de Belmonte</h1></div><div style="display:flex;gap:6px"><button class="back" data-action="back">Voltar</button><button class="back" data-action="home">Início</button></div></div><p class="intro">Mapa de trabalho com camadas independentes, nomes e acesso à navegação. Toca nos recursos para ver detalhes e abrir o Google Maps.</p><div class="card" style="padding:13px"><strong>Camadas do mapa</strong><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;font-size:13px"><label><input type="checkbox" data-layer="hydrants" checked> Hidrantes do Regadio (7)</label><label><input type="checkbox" data-layer="urban"> Hidrantes Urbanos (por georreferenciar)</label><label><input type="checkbox" data-layer="a23gpx" checked> A23 e nós de acesso</label><label><input type="checkbox" data-layer="roads" checked> Rede de Estradas do Concelho de Belmonte</label><label><input type="checkbox" data-layer="railway" checked> Linha Ferroviária</label><label><input type="checkbox" data-layer="railpoints" checked> Estações e Passagens de Nível</label><label><input type="checkbox" data-layer="localities" checked> Localidades do Concelho</label><label><input type="checkbox" data-layer="boundaries" checked> Limites de freguesia</label><label><input type="checkbox" data-layer="myposition" checked> Minha posição GPS</label><label><input type="checkbox" data-layer="satellite"> Imagem de satélite</label></div><p id="cartostatus" class="muted" style="margin:12px 0 0">Abertura prioritária com dados guardados neste iPhone. Os dados vetoriais locais podem ser consultados sem rede.</p><button class="secondary" style="width:100%;margin-top:10px" data-action="refreshcarto">Atualizar limites de freguesia (requer Internet)</button></div><div class="mapwrap" id="cartomapwrap"><div class="maptools"><span>Belmonte — mapa operacional</span><div style="display:flex;gap:6px"><button class="back" data-action="zoomall">Ver concelho</button><button class="back" data-action="expandmap" aria-expanded="false">Expandir mapa ⛶</button></div></div><div id="cartoloading" class="mapnote">A abrir o mapa e os dados vetoriais locais. Os limites oficiais são atualizados através da DGT quando há Internet.</div><div id="cartomap" class="map" style="height:430px"></div><div class="mapnote">Base cartográfica © OpenStreetMap contributors. O fundo do mapa e a imagem de satélite só ficam disponíveis offline nas zonas/níveis já consultados e guardados. As camadas vetoriais locais e dados guardados podem ser consultados sem rede. Não utilizar como cartografia operacional certificada sem validação no terreno.</div></div><div class="card"><strong>PK de referência — nós da A23</strong><p class="muted">Valores transcritos da imagem fornecida. A entrada/saída e o sentido de circulação ficam por confirmar documentalmente; não são presumidos. Os dados são locais e aparecem sem esperar pela consulta cartográfica.</p><div class="list">${[['(34) Benespera','199,2','199,7'],['(33) Maçainhas','190,1','190,6'],['(32) Caria','181,7','182,1'],['(31) Covilhã Norte','172,6','172,9']].map(n=>`<div class="rowbtn"><span class="num">${n[0].match(/\d+/)[0]}</span><span class="rowmain"><strong>${n[0]}</strong><small>PK ${n[1]} · PK ${n[2]}<br>Entrada/saída e sentido: por confirmar documentalmente</small><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('Nó '+n[0]+' A23 Portugal')}">Pesquisar localização do nó no Google Maps</a></span></div>`).join('')}</div></div><div class="card"><strong>Legenda e validação</strong><p class="muted">Símbolos coloridos por tipo de recurso. Os limites de freguesia devem ser confirmados com cartografia oficial. Validar os dados no terreno antes de utilização operacional.</p><button class="secondary" data-action="list">Consultar os 7 hidrantes</button></div>`;setTimeout(initCartography,100)}
function initCartography(){
 const el=document.getElementById('cartomap');if(!el)return;
 if(typeof L==='undefined'){el.innerHTML='<div class="empty">A biblioteca do mapa não carregou. Verifica a ligação à Internet e atualiza a página.</div>';return}
 if(cartoMap)cartoMap.remove();cartoLayers={};
 cartoMap=L.map(el).setView([40.335,-7.335],11);
 baseStreet=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(cartoMap);
 baseSatellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri'});
 cartoLayers.hydrants=L.layerGroup(points.map(p=>L.circleMarker([p.lat,p.lon],{radius:8,color:'#075985',fillColor:'#38bdf8',fillOpacity:.95}).bindPopup(`<strong>Hidrante ${p.id} — ${escapeHtml(p.name)}</strong><br>Latitude: ${p.lat.toFixed(6)}<br>Longitude: ${p.lon.toFixed(6)}<br><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}&travelmode=driving">Navegar até aqui</a><br><button type="button" data-point="${p.id}">Ver ficha do hidrante</button>`))).addTo(cartoMap);
 ['boundaries','urban','myposition','a23gpx','roads','railway','railpoints','localities'].forEach(k=>cartoLayers[k]=L.layerGroup());
 let positionMarker=null;
 if(navigator.geolocation)navigator.geolocation.getCurrentPosition(pos=>{const ll=[pos.coords.latitude,pos.coords.longitude];const targetHtml='<div class="gps-target-marker"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15" fill="none" stroke="#dc2626" stroke-width="3.5"/><circle cx="20" cy="20" r="5" fill="#dc2626" stroke="white" stroke-width="2"/><path d="M20 1v9M20 30v9M1 20h9M30 20h9" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/></svg></div>';const targetIcon=L.divIcon({className:'gps-target-icon',html:targetHtml,iconSize:[42,42],iconAnchor:[21,21]});positionMarker=L.marker(ll,{icon:targetIcon,zIndexOffset:2000}).bindPopup('<strong>Minha posição</strong><br>GPS atual').addTo(cartoLayers.myposition);if(document.querySelector('[data-layer="myposition"]')?.checked)cartoLayers.myposition.addTo(cartoMap)},()=>{} ,{enableHighAccuracy:false,timeout:4000,maximumAge:120000});
 document.querySelectorAll('[data-layer]').forEach(cb=>cb.addEventListener('change',()=>{if(cb.dataset.layer==='satellite'){if(cb.checked){if(cartoMap.hasLayer(baseStreet))cartoMap.removeLayer(baseStreet);baseSatellite.addTo(cartoMap)}else{if(cartoMap.hasLayer(baseSatellite))cartoMap.removeLayer(baseSatellite);baseStreet.addTo(cartoMap)}return}const key=cb.dataset.layer;const layer=cartoLayers[key];if(!layer)return;if(cb.checked){layer.addTo(cartoMap);if(key==='a23gpx'&&!cartoLayers.a23gpx._loaded)loadLocalA23GPX();if(key==='roads'&&!cartoLayers.roads._loaded)loadLocalRoads();if(key==='railway'&&!cartoLayers.railway._loaded)loadLocalGeoLayer('linha-ferroviaria.geojson','railway');if(key==='railpoints'&&!cartoLayers.railpoints._loaded)loadRailPoints();if(key==='localities'&&!cartoLayers.localities._loaded)loadLocalities();if(key==='boundaries'&&!layer._official)loadOfficialBoundaries()}else cartoMap.removeLayer(layer)}));
 setTimeout(()=>cartoMap.invalidateSize(),250);
 // Camadas locais selecionadas: carregar sem consultas externas e reutilizar o cache offline.
 loadLocalA23GPX(); loadLocalRoads(); loadLocalGeoLayer('linha-ferroviaria.geojson','railway'); loadRailPoints(); loadLocalities();
 loadOfficialBoundaries(true);
}

async function loadLocalA23GPX(){
 if(!cartoLayers.a23gpx||cartoLayers.a23gpx._loaded)return;
 const status=document.getElementById('cartostatus');
 try{
  const r=await fetch('./a23-com-nos.geojson?v=20261101-noslegenda',{cache:'reload'});
  if(!r.ok)throw Error('Ficheiro local da A23 indisponível');
  const geo=await r.json();
  const layer=L.geoJSON(geo,{
   style:f=>({color:'#dc2626',weight:6,opacity:.95}),
   pointToLayer:(f,ll)=>{const p=f.properties||{};if(p.kind==='a23_junction'){const labels={'31':'31 | Covilhã Norte','32':'32 | Caria','33':'33 | Maçainhas','34':'34 | Benespera'};const label=labels[String(p.name)]||String(p.name||'Nó A23');return L.marker(ll,{icon:L.divIcon({className:'locality-sign-icon',html:'<span class="a23-sign">'+escapeHtml(label)+'</span>',iconSize:null,iconAnchor:[0,15]})});}return L.circleMarker(ll,{radius:9,color:'#7f1d1d',weight:2,fillColor:'#fb923c',fillOpacity:1});},
   onEachFeature:(f,lyr)=>{const p=f.properties||{};const junctionNames={'31':'31 | Covilhã Norte','32':'32 | Caria','33':'33 | Maçainhas','34':'34 | Benespera'};const shownName=p.kind==='a23_junction'?(junctionNames[String(p.name)]||String(p.name||'Nó A23')):(p.name||'A23');let body=`<strong>${escapeHtml(shownName)}</strong>`;if(p.description)body+=`<br>${escapeHtml(p.description)}`;if(p.kind==='a23_junction')body+='<br>Nó de acesso à A23';else body+='<br>Traçado da autoestrada';const c=lyr.getLatLng?lyr.getLatLng():null;if(c)body+=`<br>Latitude: ${c.lat.toFixed(6)}<br>Longitude: ${c.lng.toFixed(6)}<br><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lng}&travelmode=driving">Navegar até aqui</a>`;lyr.bindPopup(body).bindTooltip(escapeHtml(shownName),{sticky:true});}
  });
  layer.addTo(cartoLayers.a23gpx);cartoLayers.a23gpx._loaded=true;
  const cb=document.querySelector('[data-layer="a23gpx"]');if(cb?.checked)cartoLayers.a23gpx.addTo(cartoMap);
  if(status)status.textContent='A23 e nós de acesso carregados.';
 }catch(e){console.warn('A23 GPX:',e);if(status)status.textContent='Não foi possível carregar a A23. Confirma que a23-com-nos.geojson está na raiz da aplicação.';}
}

async function loadLocalRoads(){
 if(!cartoLayers.roads||cartoLayers.roads._loaded)return;
 const status=document.getElementById('cartostatus');
 try{
  const r=await fetch('./rede-estradas-concelho-belmonte.geojson?v=20261031-estradas2',{cache:'reload'});
  if(!r.ok)throw Error('Ficheiro local da rede de estradas indisponível');
  const geo=await r.json();
  // Cada estrada recebe uma cor própria e o nome fica visível diretamente no mapa.
  const roadColors=['#e11d48','#2563eb','#16a34a','#9333ea','#ea580c','#0891b2','#a16207','#db2777','#4f46e5','#65a30d'];
  const roadFeatures=(geo.features||[]).filter(f=>f.geometry&&f.geometry.type!=='Point');
  const colorByName={};roadFeatures.forEach((f,i)=>{colorByName[f.properties?.display_name||f.properties?.name||String(i)]=roadColors[i%roadColors.length]});
  const layer=L.geoJSON({...geo,features:roadFeatures},{
   style:f=>({color:colorByName[f.properties?.display_name||f.properties?.name]||'#2563eb',weight:5,opacity:.95}),
   onEachFeature:(f,lyr)=>{const p=f.properties||{};const name=p.display_name||p.name||'Rede de Estradas';let body=`<strong>${escapeHtml(name)}</strong>`;if(p.source_name)body+=`<br><small>Código GPX: ${escapeHtml(p.source_name)}</small>`;if(p.description)body+=`<br>${escapeHtml(p.description)}`;lyr.bindPopup(body);}
  });
  // Etiquetas criadas como marcadores independentes no ponto médio de cada estrada.
  // Assim ficam sempre visíveis e não dependem do posicionamento de tooltips em linhas longas.
  const labelMarkers=L.layerGroup();
  roadFeatures.forEach((f,i)=>{
   const name=f.properties?.display_name||f.properties?.name||'Estrada';
   const line=L.geoJSON(f).getLayers()[0];
   if(!line||typeof line.getLatLngs!=='function')return;
   let coords=line.getLatLngs();
   while(Array.isArray(coords[0])&&coords[0].length&&Array.isArray(coords[0][0]))coords=coords[0];
   if(!coords.length)return;
   const mid=coords[Math.floor((coords.length-1)/2)];
   const color=roadColors[i%roadColors.length];
   const icon=L.divIcon({className:'',html:`<span class="road-name-label" style="border-left:5px solid ${color}">${escapeHtml(name)}</span>`,iconSize:null,iconAnchor:[24,10]});
   L.marker(mid,{icon,interactive:false,keyboard:false,zIndexOffset:1000}).addTo(labelMarkers);
  });
  layer.addTo(cartoLayers.roads);labelMarkers.addTo(cartoLayers.roads);cartoLayers.roads._loaded=true;
  const cb=document.querySelector('[data-layer="roads"]');if(cb?.checked)cartoLayers.roads.addTo(cartoMap);
  if(status)status.textContent='A23 e Rede de Estradas do Concelho de Belmonte carregadas.';
 }catch(e){console.warn('Rede de Estradas:',e);if(status)status.textContent='Não foi possível carregar a Rede de Estradas. Confirma que rede-estradas-concelho-belmonte.geojson está na raiz da aplicação.';}
}


async function loadLocalGeoLayer(file,key){
 if(!cartoLayers[key]||cartoLayers[key]._loaded)return;
 try{const r=await fetch('./'+file+'?v=20261101',{cache:'no-store'});if(!r.ok)throw Error(file);const geo=await r.json();
 const lyr=L.geoJSON(geo,{style:()=>({color:'#7c3aed',weight:5,opacity:.95,dashArray:'9 7'}),onEachFeature:(f,l)=>{const p=f.properties||{};l.bindPopup('<strong>'+escapeHtml(p.name||'Linha ferroviária')+'</strong>');l.bindTooltip('Linha ferroviária',{sticky:true})}});
 lyr.addTo(cartoLayers[key]);cartoLayers[key]._loaded=true;if(document.querySelector('[data-layer="'+key+'"]')?.checked)cartoLayers[key].addTo(cartoMap);
 }catch(e){console.warn(key,e);const s=document.getElementById('cartostatus');if(s)s.textContent='Não foi possível carregar '+file+'. Confirma que está na raiz da aplicação.';}

function pointFeatureLayer(geo,key){return L.geoJSON(geo,{pointToLayer:(f,ll)=>{const station=f.properties?.kind==='station';const locality=f.properties?.kind==='locality';const name=f.properties?.display_name||f.properties?.name||'Local';const html=locality?'<span class="locality-sign">'+escapeHtml(name)+'</span>':station?'<span class="map-pin station-pin">🚉</span>':'<span class="map-pin crossing-pin">✕</span>';const icon=locality?L.divIcon({className:'locality-sign-icon',html,iconSize:null,iconAnchor:[0,15]}):L.divIcon({className:'',html,iconSize:[28,28],iconAnchor:[14,14]});return L.marker(ll,{icon});},onEachFeature:(f,l)=>{const p=f.properties||{},ll=f.geometry.coordinates,name=p.display_name||p.name||'Local';const url='https://www.google.com/maps/dir/?api=1&destination='+ll[1]+','+ll[0]+'&travelmode=driving';l.bindPopup('<strong>'+escapeHtml(name)+'</strong><br>'+(p.kind==='station'?'Estação ferroviária':p.kind==='locality'?'Localidade':'Passagem de nível')+'<br><a target="_blank" rel="noopener" href="'+url+'">Obter direções no Google Maps</a>');if(p.kind!=='locality')l.bindTooltip(escapeHtml(name),{sticky:true});}})}

function positionView(){currentView='position';setActive('');content.innerHTML=`<div class="sectionhead"><div><p class="eyebrow">Orientação no terreno</p><h1 class="heading">Minha posição</h1></div><div style="display:flex;gap:6px"><button class="back" data-action="back">Voltar</button><button class="back" data-action="home">Início</button></div></div><p class="intro">Obtém a posição do dispositivo, as coordenadas geográficas e UTM, a via/localidade reconhecida e a orientação da bússola. O PK e o sentido de circulação só são apresentados quando existirem dados fiáveis.</p><button class="primary positionbtn" data-action="getposition">⌖ Obter / atualizar minha posição</button><div class="card"><strong>Coordenadas atuais</strong><div id="positionstatus" class="muted" style="margin-top:8px">Ainda não foi obtida uma posição. Permite o acesso à localização quando o navegador perguntar.</div><div id="positioncoords" class="coords" style="display:none"></div><div id="roadinfo" class="coords" style="display:none"><strong>Via/localidade:</strong> a identificar…</div><div class="actions"><button class="secondary" data-action="copygps">Copiar coordenadas</button><button class="secondary" data-action="sharegps">Partilhar localização</button><button class="secondary" data-action="navigatecurrent">Abrir no mapa</button></div></div><div class="card"><strong>Bússola</strong><p class="muted">Em iPhone, carrega em ativar e autoriza o acesso aos sensores, se solicitado. Mantém o dispositivo na horizontal.</p><div class="compassbox"><div class="compass" aria-label="Bússola"><span class="north">N</span><span class="east">E</span><span class="south">S</span><span class="west">O</span><div id="compassneedle" class="needle"></div></div><div class="readout"><div>Direção: <strong id="headingvalue">—°</strong></div><div>Ponto cardeal: <strong id="cardinalvalue">—</strong></div><div class="muted" id="compassstatus">Bússola ainda não ativada.</div></div></div><button class="secondary positionbtn" style="margin-top:14px" data-action="compass">Ativar bússola</button></div><p class="muted">A localização e a bússola dependem do equipamento, das permissões e do navegador. Em alguns dispositivos, a orientação pode não estar disponível. As coordenadas UTM são calculadas para WGS84, zona 29N, adequada à região de Belmonte; se estiveres fora dessa zona, a zona será ajustada automaticamente.</p>`;getPosition()}
let currentPosition=null,compassListening=false;
function toUTM(lat,lon){const a=6378137,e=0.08181919084262149,k0=.9996;const zone=Math.floor((lon+180)/6)+1;const lon0=((zone-1)*6-180+3)*Math.PI/180;const latR=lat*Math.PI/180,lonR=lon*Math.PI/180;const ep2=e*e/(1-e*e),N=a/Math.sqrt(1-e*e*Math.sin(latR)**2),T=Math.tan(latR)**2,C=ep2*Math.cos(latR)**2,A=Math.cos(latR)*(lonR-lon0);const M=a*((1-e*e/4-3*e**4/64-5*e**6/256)*latR-(3*e*e/8+3*e**4/32+45*e**6/1024)*Math.sin(2*latR)+(15*e**4/256+45*e**6/1024)*Math.sin(4*latR)-(35*e**6/3072)*Math.sin(6*latR));const E=500000+k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120);let north=k0*(M+N*Math.tan(latR)*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720));if(lat<0)north+=10000000;return {zone,band:'CDEFGHJKLMNPQRSTUVWXX'[Math.floor((lat+80)/8)],easting:Math.round(E),northing:Math.round(north)}}
function toDMS(value,isLat){const hemi=value<0?(isLat?'S':'W'):(isLat?'N':'E');const abs=Math.abs(value);const deg=Math.floor(abs);const minFloat=(abs-deg)*60;const min=Math.floor(minFloat);const sec=((minFloat-min)*60).toFixed(2).padStart(5,'0');return `${String(deg).padStart(isLat?2:3,'0')}° ${String(min).padStart(2,'0')}′ ${sec}″ ${hemi}`}
function getPosition(){const st=document.getElementById('positionstatus');if(!navigator.geolocation){if(st)st.textContent='Este navegador não disponibiliza geolocalização.';return}if(st)st.textContent='A obter posição GPS…';navigator.geolocation.getCurrentPosition(pos=>{currentPosition={lat:pos.coords.latitude,lon:pos.coords.longitude,accuracy:pos.coords.accuracy};const u=toUTM(currentPosition.lat,currentPosition.lon);const box=document.getElementById('positioncoords');if(box){box.style.display='block';box.innerHTML=`<strong>Latitude:</strong> ${toDMS(currentPosition.lat,true)}<br><strong>Longitude:</strong> ${toDMS(currentPosition.lon,false)}<br><strong>Precisão estimada:</strong> ±${Math.round(currentPosition.accuracy)} m<br><hr style="border:0;border-top:1px solid #ddd"><strong>Decimal:</strong> ${currentPosition.lat.toFixed(6)}, ${currentPosition.lon.toFixed(6)}<br><strong>UTM:</strong> Zona ${u.zone}${u.band}<br><strong>Este (E):</strong> ${u.easting} m<br><strong>Norte (N):</strong> ${u.northing} m<br><strong>Referencial:</strong> WGS84`};if(st)st.textContent='Posição obtida. Confirma a precisão indicada antes de usar no terreno.';identifyRoad(currentPosition.lat,currentPosition.lon)},err=>{if(st)st.textContent=err.code===1?'Permissão de localização recusada. Ativa-a nas definições do navegador/dispositivo.':err.code===2?'Posição indisponível. Tenta num local com melhor sinal GPS.':'O pedido de localização demorou demasiado. Tenta novamente.'},{enableHighAccuracy:true,timeout:20000,maximumAge:5000})}
async function identifyRoad(lat,lon){const box=document.getElementById('roadinfo');if(!box)return;box.style.display='block';box.innerHTML='<strong>Via/localidade:</strong> a identificar…';try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`,{headers:{'Accept':'application/json'}});if(!r.ok)throw Error('indisponível');const d=await r.json(),a=d.address||{};const road=a.road||a.pedestrian||a.path||a.highway||a.footway||'Via não identificada';const place=a.village||a.hamlet||a.town||a.city||a.suburb||a.neighbourhood||a.municipality||'Localidade não identificada';const ref=a.ref?` · referência ${escapeHtml(a.ref)}`:'';const roadLabel=(/\bA ?23\b/i.test(road+' '+(a.ref||''))?'A23':/\bA ?25\b/i.test(road+' '+(a.ref||''))?'A25':escapeHtml(road));box.innerHTML=`<strong>Via:</strong> ${roadLabel}${ref}<br><strong>Localidade:</strong> ${escapeHtml(place)}<br><strong>PK:</strong> não disponível com fiabilidade nesta fonte<br><strong>Sentido de circulação:</strong> não confirmado pelo GPS`; }catch(e){box.innerHTML='<strong>Via/localidade:</strong> não foi possível identificar (verifica a ligação à Internet).<br><strong>Quilómetro/sentido:</strong> não confirmado automaticamente';}}
function cardinal(deg){return ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'][Math.round(deg/22.5)%16]}
async function enableCompass(){const st=document.getElementById('compassstatus');try{if(typeof DeviceOrientationEvent==='undefined'){if(st)st.textContent='Este dispositivo/navegador não disponibiliza a bússola.';return}if(typeof DeviceOrientationEvent.requestPermission==='function'){const permission=await DeviceOrientationEvent.requestPermission();if(permission!=='granted'){if(st)st.textContent='Acesso aos sensores não autorizado.';return}}if(!compassListening){window.addEventListener('deviceorientationabsolute',orientationUpdate,true);window.addEventListener('deviceorientation',orientationUpdate,true);compassListening=true}if(st)st.textContent='À espera da orientação do dispositivo…'}catch(e){if(st)st.textContent='Não foi possível ativar a bússola. Verifica as permissões e tenta novamente.'}}
function orientationUpdate(e){let h;if(typeof e.webkitCompassHeading==='number')h=e.webkitCompassHeading;else if(typeof e.alpha==='number')h=(360-e.alpha)%360;else return;h=(h+360)%360;const needle=document.getElementById('compassneedle'),hv=document.getElementById('headingvalue'),cv=document.getElementById('cardinalvalue'),st=document.getElementById('compassstatus');if(needle)needle.style.transform=`rotate(${h}deg)`;if(hv)hv.textContent=`${Math.round(h)}°`;if(cv)cv.textContent=cardinal(h);if(st)st.textContent='Orientação do dispositivo ativa.'}

function showDocs(title,items){currentView='docs';setActive('');content.innerHTML=`<div class="sectionhead"><div><p class="eyebrow">Emergência Pré-Hospitalar</p><h1 class="heading">${title}</h1></div><div style="display:flex;gap:6px"><button class="back" data-action="eph">Voltar</button><button class="back" data-action="home">Início</button></div></div><p class="muted">Documentos originais enviados para consulta. Toca numa imagem para ampliar. Confirma sempre os protocolos em vigor e as orientações do CODU.</p>${items.map(x=>`<div class="doccard"><h3>${x[0]}</h3><img class="docimg" src="${x[1]}" alt="${x[0]}" data-zoom="${x[1]}"></div>`).join('')}`}
function vitalsTable(title,subtitle,rows,source){return `<div class="card" style="margin:12px 0"><h3 style="margin:0 0 5px">${title}</h3><p class="muted" style="margin:0 0 12px">${subtitle}</p><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:14px"><thead><tr style="background:#f3f4f6;text-align:left"><th style="padding:9px;border-bottom:1px solid #ddd">Parâmetro</th><th style="padding:9px;border-bottom:1px solid #ddd">Referência</th></tr></thead><tbody>${rows.map(r=>`<tr><td style="padding:9px;border-bottom:1px solid #eee;font-weight:600">${r[0]}</td><td style="padding:9px;border-bottom:1px solid #eee">${r[1]}</td></tr>`).join('')}</tbody></table></div><p class="muted" style="font-size:12px;margin:10px 0 0">Fonte: ${source}</p></div>`}
function adultDocs(){currentView='docs';setActive('');content.innerHTML=`<div class="sectionhead"><div><p class="eyebrow">Emergência Pré-Hospitalar</p><h1 class="heading">Adulto</h1></div><div style="display:flex;gap:6px"><button class="back" data-action="eph">Voltar</button><button class="back" data-action="home">Início</button></div></div><p class="intro">Parâmetros de referência para consulta rápida. Interpretar sempre em conjunto com a avaliação clínica e o contexto da ocorrência.</p><div class="card" style="margin:12px 0"><h3 style="margin-top:0">Auxiliar de memória — ABCDE</h3><ol><li><b>A — Via aérea:</b> permeabilidade, ruídos, secreções/corpos estranhos e proteção cervical quando indicada.</li><li><b>B — Ventilação/oxigenação:</b> frequência, amplitude, simetria, esforço respiratório e SpO₂.</li><li><b>C — Circulação:</b> hemorragias, pulso, frequência cardíaca, pele, perfusão e pressão arterial.</li><li><b>D — Neurológico:</b> estado de consciência, resposta pupilar e glicemia quando indicada/protocolada.</li><li><b>E — Exposição:</b> observar lesões e contexto, preservando privacidade e prevenindo hipotermia.</li></ol><p class="muted" style="font-size:12px">Fonte: Manual TAS — Abordagem da Vítima, março 2024. Seguir a sequência e os procedimentos definidos na formação e protocolos aplicáveis.</p></div>${vitalsTable('Parâmetros vitais — adulto','Valores de referência indicados no Manual TAS.',[['Frequência respiratória','12–20 ciclos/min'],['Frequência cardíaca / pulso','60–100 batimentos/min'],['Pressão arterial sistólica','100–140 mmHg'],['Pressão arterial diastólica','60–90 mmHg'],['Temperatura — febre','Retal ≥ 38,0 °C · Axilar ≥ 37,6 °C · Timpânica ≥ 37,8 °C · Oral ≥ 37,6 °C'],['Temperatura — hipotermia','< 35,0 °C'],['SpO₂ alvo — adulto','92–96%'],['SpO₂ alvo — DPOC','88–92%']],'Manual TAS — Abordagem da Vítima, pp. 34–37 e 42 (março 2024).') }<div class="card" style="margin:12px 0"><strong>Reavaliação dos parâmetros</strong><p class="muted" style="margin:6px 0 0">O manual recomenda reavaliar pelo menos de 5 em 5 minutos numa vítima crítica e de 15 em 15 minutos numa vítima não crítica. Registar e comunicar os valores e a sua evolução.</p><p class="muted" style="font-size:12px;margin:8px 0 0">Fonte: Manual TAS — Abordagem da Vítima, p. 33 (março 2024).</p></div>${[['Algoritmo OVA Adulto','algoritmo-ova-adulto.png'],['SBV Adulto','sbv-adulto.png'],['SBV-DAE Adulto','sbv-dae-adulto.png']].map(x=>`<div class="doccard"><h3>${x[0]}</h3><img class="docimg" src="${x[1]}" alt="${x[0]}" data-zoom="${x[1]}"></div>`).join('')}<div class="card" style="margin:12px 0"><h3 style="margin-top:0">OVA — adulto consciente</h3><p><b>Ligeira:</b> vítima reativa, capaz de falar, tossir e respirar; tosse eficaz. Incentivar a tosse e vigiar.</p><p><b>Grave:</b> incapaz de falar, tosse fraca/ineficaz ou ausente, incapacidade de movimentar ar e/ou cianose. Atuar sem demora:</p><ol><li>Inclinar a vítima para a frente e aplicar até 5 pancadas interescapulares, reavaliando após cada uma.</li><li>Se não resolver, aplicar até 5 compressões abdominais, reavaliando após cada uma.</li><li>Alternar 5 pancadas + 5 compressões até resolver ou a vítima ficar inconsciente.</li><li>Em grávidas ou pessoas com obesidade, substituir compressões abdominais por compressões torácicas.</li><li>Se ficar inconsciente: apoiar no chão, ativar 112 e iniciar SBV; antes das insuflações, observar a boca e remover apenas corpo estranho visível e acessível.</li></ol><p class="muted" style="font-size:12px">Fonte: INEM, Manual SBV-DAE, versão 2, pp. 25–27. Todas as vítimas submetidas a compressões abdominais/torácicas devem ser observadas por médico, mesmo após resolução.</p></div><div class="card" style="margin:12px 0"><h3 style="margin-top:0">SBV — pontos-chave para consulta</h3><ul><li>Confirmar segurança, avaliar resposta e permeabilizar a via aérea.</li><li>Avaliar a respiração (VOS) durante, no máximo, 10 segundos. Respiração agónica não é respiração normal.</li><li>Se não respira normalmente: ativar 112/CODU e iniciar SBV.</li><li><b>30 compressões : 2 insuflações</b>; 100–120 compressões/min; profundidade de 5–6 cm no adulto.</li><li>Permitir o retorno completo do tórax e minimizar interrupções. As duas insuflações não devem demorar mais de 10 segundos.</li><li>Manter SBV até chegada/substituição por ajuda diferenciada, recuperação de sinais de vida ou exaustão.</li></ul><p class="muted" style="font-size:12px">Fonte: Manual SBV-DAE INEM, versão 2, pp. 10–15 e 21–22.</p></div><div class="card" style="margin:12px 0"><h3 style="margin-top:0">DAE — sequência essencial</h3><ol><li>Ligar o DAE assim que disponível e seguir os comandos.</li><li>Expor e preparar o tórax; colocar os elétrodos conforme as indicações do fabricante.</li><li>Durante a análise, ninguém toca na vítima.</li><li>Se indicar choque, confirmar em voz alta que todos estão afastados e administrar o choque.</li><li>Após choque ou indicação de choque não recomendado, retomar imediatamente SBV e seguir o DAE.</li><li>Manter compressões enquanto o DAE carrega, sempre que o equipamento e a segurança o permitam.</li></ol><p class="muted" style="font-size:12px">Fonte: Manual SBV-DAE INEM, versão 2, pp. 17–22. Aplicação do DAE apenas por operacionais enquadrados no programa/licenciamento aplicável.</p></div><p class="muted">Material de apoio. Confirmar sempre os protocolos e orientações em vigor do INEM/CODU.</p>`}
function pedDocs(){currentView='docs';setActive('');content.innerHTML=`<div class="sectionhead"><div><p class="eyebrow">Emergência Pré-Hospitalar</p><h1 class="heading">Pediátrico</h1></div><div style="display:flex;gap:6px"><button class="back" data-action="eph">Voltar</button><button class="back" data-action="home">Início</button></div></div><p class="intro">Valores de referência organizados por grupos etários. A avaliação pediátrica deve considerar a aparência, o trabalho respiratório e a circulação, não apenas os números.</p><div class="card" style="margin:12px 0"><h3 style="margin-top:0">Auxiliar de memória — avaliação pediátrica</h3><p><b>Primeiro olhar:</b> aparência, trabalho respiratório e circulação à pele. Uma criança pode deteriorar rapidamente; observar comportamento, interação, tónus, esforço respiratório, cor e perfusão.</p><p><b>Depois:</b> organizar a avaliação pelo ABCDE, corrigindo de imediato as ameaças identificadas e reavaliando a resposta.</p><p class="muted" style="font-size:12px">Fonte: Manual TAS — Emergências Pediátricas, março 2024. Não substituir avaliação estruturada nem protocolos pediátricos.</p></div>${vitalsTable('Frequência respiratória','Valores de referência por idade.',[['Recém-nascido','40–60 ciclos/min'],['1–12 meses','25–40 ciclos/min'],['1–5 anos','20–40 ciclos/min'],['6–10 anos','15–30 ciclos/min'],['Mais de 10 anos','12–18 ciclos/min']],'Manual TAS — Emergências Pediátricas, p. 18, Quadro 7 (março 2024).')}${vitalsTable('Frequência cardíaca','Valores de referência por idade.',[['Recém-nascido','100–180 bpm'],['1–12 meses','80–180 bpm'],['1–5 anos','70–140 bpm'],['6–10 anos','60–120 bpm'],['Mais de 10 anos','60–100 bpm']],'Manual TAS — Emergências Pediátricas, p. 20, Quadro 8 (março 2024).')}${vitalsTable('Pressão arterial sistólica mínima aceitável','Limites inferiores indicados no manual. Não são intervalos de normalidade.',[['Recém-nascido','> 60 mmHg (ou pulso central forte)'],['1–12 meses','> 70 mmHg (ou pulso central forte)'],['1–10 anos','> 70 + (2 × idade em anos) mmHg'],['Mais de 10 anos','> 90 mmHg']],'Manual TAS — Emergências Pediátricas, p. 20, Quadro 9 (março 2024).')}${vitalsTable('Temperatura — febre','Critérios de febre por local de medição.',[['Retal','≥ 38,0 °C'],['Axilar','≥ 37,6 °C'],['Timpânica','≥ 37,8 °C'],['Oral','≥ 37,6 °C']],'Manual TAS — Abordagem da Vítima, p. 37, Quadro 17; Manual TAS — Emergências Pediátricas, p. 42 (março 2024).')}<div class="card" style="margin:12px 0"><strong>Atenção à interpretação</strong><p class="muted" style="margin:6px 0 0">Uma frequência respiratória dentro do intervalo não garante, por si só, oxigenação e ventilação adequadas. O manual destaca FR superior a 60 cpm, sobretudo com aparência anormal ou tiragem global, como indicador de dificuldade respiratória grave e possível falência respiratória.</p><p class="muted" style="font-size:12px;margin:8px 0 0">Fonte: Manual TAS — Emergências Pediátricas, pp. 17–18 (março 2024).</p></div><div class="card" style="margin:12px 0"><h3 style="margin-top:0">OVA — lactente e criança consciente</h3><p><b>Reconhecer:</b> tosse eficaz, capacidade de falar/chorar e respirar sugerem obstrução ligeira. Incentivar a tosse e vigiar; não executar manobras enquanto a tosse for eficaz.</p><p><b>Se tosse ineficaz / obstrução grave:</b> pedir ajuda/ligar 112 em alta voz e iniciar manobras.</p><ol><li><b>Lactente:</b> até 5 pancadas interescapulares, com a cabeça mais baixa que o tronco; se não resolver, até 5 compressões torácicas. Alternar ciclos de 5 + 5.</li><li><b>Criança:</b> até 5 pancadas interescapulares com a vítima inclinada para a frente; se não resolver, até 5 compressões abdominais. Alternar ciclos de 5 + 5.</li><li>Após cada sequência, reavaliar. Remover apenas objeto visível; nunca fazer exploração digital às cegas.</li><li>Se ficar inconsciente: colocar em superfície rígida, iniciar SBV pediátrico com 5 insuflações iniciais, ligar 112 em alta voz e prosseguir 15:2. Reavaliar a via aérea e remover apenas objeto visível.</li></ol><p class="muted" style="font-size:12px">Fonte: INEM, Manual SBV Pediátrico, versão 4.0 (2022), pp. 20–23. As técnicas variam entre lactente e criança; não aplicar compressões abdominais no lactente.</p></div><div class="doccard"><h3>Sequência ilustrada OVA pediátrica — lactente</h3><img class="docimg" src="ova-pediatrico-21.png" alt="Técnica de OVA em lactente" data-zoom="ova-pediatrico-21.png"></div><div class="doccard"><h3>Sequência ilustrada OVA pediátrica — criança</h3><img class="docimg" src="ova-pediatrico-22.png" alt="Técnica de OVA em criança" data-zoom="ova-pediatrico-22.png"></div><div class="doccard"><h3>Algoritmo SBV Pediátrico</h3><img class="docimg" src="sbv-pediatrico.png" alt="Algoritmo SBV Pediátrico" data-zoom="sbv-pediatrico.png"></div><div class="card" style="margin:12px 0"><h3 style="margin-top:0">SBV Pediátrico — pontos-chave</h3><ul><li>O manual define lactente como 29 dias até 1 ano; criança como 1 até 18 anos. Recém-nascido não está abrangido pelo algoritmo pediátrico descrito.</li><li>Após segurança, reatividade, via aérea e VOS até 10 segundos, se não respira normalmente realizar <b>5 insuflações iniciais</b>.</li><li>Iniciar sequência de <b>15 compressões : 2 insuflações</b>.</li><li>Compressões a 100–120/min, deprimindo cerca de 1/3 do diâmetro ântero-posterior do tórax; evitar ultrapassar 6 cm nas crianças maiores.</li><li>Trocar o reanimador que comprime a cada 2 minutos, minimizando pausas.</li><li>Se estiver sozinho e sem telemóvel: após as 5 insuflações, realizar 1 minuto de SBV antes de se afastar para pedir ajuda, procurando minimizar interrupções.</li></ul><p class="muted" style="font-size:12px">Fonte: Manual SBV Pediátrico INEM, versão 4.0 (2022), pp. 8–17.</p></div><div class="card" style="margin:12px 0"><h3 style="margin-top:0">DAE em crianças</h3><ul><li>Os DAE standard são adequados a partir dos 8 anos (ou 25 kg), segundo o manual.</li><li>Até aos 8 anos, usar sistema atenuador de corrente e/ou elétrodos pediátricos, se disponíveis.</li><li>Se não existirem elétrodos pediátricos ou o tórax for demasiado pequeno, usar posição ântero-posterior, evitando contacto entre elétrodos.</li><li>Nos lactentes, a prioridade é SBV de elevada qualidade; a utilização do DAE não deve atrasar o SBV.</li><li>Seguir sempre as instruções do equipamento e o enquadramento do programa DAE.</li></ul><p class="muted" style="font-size:12px">Fonte: Manual SBV Pediátrico INEM, versão 4.0 (2022), p. 16; Manual SBV-DAE INEM, versão 2, p. 20.</p></div><p class="muted">Material de apoio à consulta. Não substitui formação, protocolos atualizados, orientações do CODU nem o algoritmo oficial. Em situação real, seguir a cadeia de comando e os procedimentos aplicáveis.</p>`}

function dangerousGoods(){currentView='dangerous';setActive('');content.innerHTML=`<div class="sectionhead"><div><p class="eyebrow">Apoio operacional</p><h1 class="heading">Matérias Perigosas</h1></div><div style="display:flex;gap:6px"><button class="back" data-action="back">Voltar</button><button class="back" data-action="home">Início</button></div></div><div class="card"><strong>Identificação da matéria</strong><p class="muted">Introduz o número ONU, o número de perigo (Kemler) ou ambos. Confirma sempre os algarismos diretamente no painel laranja.</p><div class="plate-entry" role="group" aria-label="Painel laranja para introdução dos números"><div class="plate-half"><label for="dgKemler">N.º DE PERIGO (KEMLER) — PARTE SUPERIOR</label><input id="dgKemler" inputmode="text" maxlength="4" placeholder="Ex.: 33 ou X333" autocomplete="off"></div><div class="plate-half"><label for="dgONU">N.º ONU — PARTE INFERIOR</label><input id="dgONU" inputmode="numeric" maxlength="4" placeholder="Ex.: 1203" autocomplete="off"></div></div><button class="primary" style="width:100%;margin-top:12px" data-action="searchDG">Pesquisar</button><p class="dg-warning" style="margin:12px 0 0"><b>Limitação importante:</b> esta base reproduz o índice e os guias do manual ANPC de 2011 (base ERG 2008). Não incorpora a marcação verde das páginas de índice nem as distâncias da Tabela 1/PTI. Se a matéria estiver assinalada a verde no manual, consulta obrigatoriamente a Tabela 1; em caso de incêndio, consulta também o guia atribuído. Confirma sempre ONU, designação, Kemler e documento de transporte. Não uses esta consulta isoladamente para definir isolamento, evacuação ou EPI.</p></div><div id="dgResults" aria-live="polite"></div><p class="muted">Fonte: Manual ANPC, edição de 2011 (adaptado do ERG 2008). Referência de apoio à fase inicial; não substitui formação, comando, confirmação documental nem aconselhamento especializado. Em caso de dúvida, aplica os procedimentos de matéria não identificada e consulta o Guia 111.</p>`}
function renderGuideTable(raw){
 const labels=['PERIGOS POTENCIAIS','SAÚDE','INCÊNDIO OU EXPLOSÃO','PROTECÇÃO DA POPULAÇÃO','VESTUÁRIO DE PROTECÇÃO','RESPOSTA À EMERGÊNCIA','INCÊNDIO','INCÊNDIOS A ENVOLVER TANQUES','DERRAME OU FUGA','PRIMEIROS SOCORROS'];
 const rows=[];let current='Orientações gerais';
 const clean=x=>x.replace(/\s+/g,' ').trim();
 for(const line of (raw||'').split(/\r?\n/)){
   const t=clean(line);if(!t||/^GUIA\s+\d+/i.test(t))continue;
   const upper=t.toLocaleUpperCase('pt-PT');
   const heading=labels.find(x=>upper===x||upper.startsWith(x+' '));
   if(heading){current=heading;continue;}
   const bullet=t.replace(/^[•·▪\-]+\s*/,'').trim();
   if(bullet.length<8)continue;
   if(/^(PERIGOS POTENCIAIS|RESPOSTA À EMERGÊNCIA)$/i.test(bullet))continue;
   let row=rows.find(x=>x[0]===current);if(!row){row=[current,[]];rows.push(row)}
   if(!row[1].includes(bullet))row[1].push(bullet);
 }
 if(!rows.length)return '<p>Não foi possível organizar este guia em tabela. Consulta o manual original.</p>';
 return `<div class="guide-table-wrap"><table class="guide-table"><thead><tr><th>Área</th><th>Orientações do manual</th></tr></thead><tbody>${rows.map(([k,v])=>`<tr><th>${escapeHtml(k)}</th><td><ul>${v.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></td></tr>`).join('')}</tbody></table></div>`;
}
let lastDangerHTML="";
function openDangerManual(){const saved=lastDangerHTML;currentView="dangerManual";content.innerHTML=`<div class="sectionhead"><div><p class="eyebrow">Matérias Perigosas</p><h1 class="heading">Manual ANPC</h1></div><button class="back" data-action="manualBack">Voltar à pesquisa</button></div><div class="card"><p class="muted">Consulta do documento original. Usa o botão para regressar à ficha da matéria sem sair da aplicação.</p><iframe class="manual-frame" src="manual-materias-perigosas-anpc.pdf" title="Manual de intervenção em emergências com matérias perigosas"></iframe><a class="secondary" style="display:flex;margin-top:10px" href="manual-materias-perigosas-anpc.pdf" download>Descarregar manual PDF</a></div>`;window._dangerSaved=saved;}
async function searchDangerous(){const onu=(document.getElementById('dgONU')?.value||'').trim();const kem=(document.getElementById('dgKemler')?.value||'').trim().toUpperCase();const box=document.getElementById('dgResults');if(!onu&&!kem){box.innerHTML='<div class="card">Introduz pelo menos um dos números.</div>';return}try{const [r,gr]=await Promise.all([fetch('materias-perigosas.json'),fetch('guias-emergencia.json')]);if(!r.ok||!gr.ok)throw Error();const db=await r.json(),guideDB=await gr.json();let matches=onu?db.materials.filter(x=>x.onu===onu):[];let html='';const plate=(o,k)=>`<div class="orange-plate" aria-label="Painel laranja: número de perigo ${k||'não indicado'}, número ONU ${o||'não indicado'}"><div class="plate-top"><span>N.º DE PERIGO (KEMLER)</span><b>${escapeHtml(k||'—')}</b></div><div class="plate-bottom"><span>N.º ONU</span><b>${escapeHtml(o||'—')}</b></div></div>`;if(onu){if(matches.length){html+=matches.map((x,i)=>{const guide=x.guide.replace('P','');const body=guideDB.guides[guide]||'';return `<div class="card dg-result">${plate(x.onu,kem)}<h2>${escapeHtml(x.name)}</h2><p><b>ONU ${escapeHtml(x.onu)}</b> · <b>Guia ${escapeHtml(x.guide)}</b></p>${x.guide.endsWith('P')?'<p class="dg-warning">Atenção: o sufixo P assinala risco de polimerização sob determinadas condições, conforme o índice do manual.</p>':''}<h3>Orientações de atuação — Guia ${escapeHtml(guide)}</h3><p class="muted">Transcrição organizada a partir do guia correspondente no PDF ANPC 2011. Confirma o texto integral no documento original; esta versão não substitui as páginas verdes/Tabela 1 nem informação especializada atualizada.</p><p class="dg-warning">O manual é de 2011 e adapta o ERG 2008. Não foi confirmada uma edição portuguesa mais recente. Para distâncias PTI/isolamento, consulta a Tabela 1 do PDF original e segue o comando e os procedimentos em vigor.</p>${body?renderGuideTable(body):'<p class="dg-warning">Texto do guia não disponível nesta extração. Consulta o manual original.</p>'}<button class="secondary" style="display:flex;width:100%;margin-top:10px" data-action="openDangerManual">Consultar manual original</button></div>`}).join('')}else html+=`<div class="card">${plate(onu,kem)}<b>N.º ONU não encontrado.</b><p>Confirma os algarismos e trata a matéria como não identificada até confirmação.</p><p>Consulta o Guia 111 e solicita apoio especializado.</p></div>`}else{html+=`<div class="card">${plate('',kem)}<h3>Interpretação do Kemler ${escapeHtml(kem)}</h3><p>${escapeHtml(kemlerMeaning(kem))}</p><p class="muted">O número de perigo descreve perigos; não identifica por si só uma matéria específica. Sem ONU confirmado, não atribuas um nome de substância.</p></div>`}if(onu&&kem){const meaning=kemlerMeaning(kem);html+=`<div class="card"><b>Verificação dos dois números</b><p>ONU introduzido: <b>${escapeHtml(onu)}</b>. Kemler introduzido: <b>${escapeHtml(kem)}</b>.</p><p>${escapeHtml(meaning)}</p><p class="dg-warning">A aplicação não confirma automaticamente a compatibilidade entre ONU e Kemler. Compara os dois campos com o painel físico e a documentação de transporte antes de atuar.</p></div>`}lastDangerHTML=html;box.innerHTML=html}catch(e){box.innerHTML='<div class="card">Não foi possível carregar a base local de matérias perigosas ou os guias. Confirma se os ficheiros JSON estão na raiz da aplicação.</div>'}}
function kemlerMeaning(code){const dict={'2':'Emissão de gás resultante de pressão ou de reação química','3':'Inflamabilidade de líquidos (vapores) e gases ou matéria líquida susceptível de auto-aquecimento','4':'Inflamabilidade de matérias sólidas ou matéria sólida susceptível de auto-aquecimento','5':'Comburência (facilita o incêndio)','6':'Toxicidade ou perigo de infecção','7':'Radioactividade','8':'Corrosividade','9':'Perigo de reacção violenta espontânea','0':'Sem perigo subsidiário indicado'};if(code.startsWith('X'))return 'Reage perigosamente com a água. Não utilizar água sem avaliação técnica específica.';const digits=code.split('');let parts=digits.map(d=>dict[d]).filter(Boolean);if(digits.length>1&&digits.every(d=>d===digits[0]))parts.push('Perigo indicado pelo algarismo repetido com intensidade acrescida.');return parts.join('; ')||'Código não interpretado automaticamente. Consulta a tabela Kemler do manual.'}

function oxygenCalc(){currentView='oxygen';setActive('');content.innerHTML=`<div class="sectionhead"><div><p class="eyebrow">Emergência Pré-Hospitalar</p><h1 class="heading">Calculadora de Autonomia de Oxigénio</h1></div><button class="back" data-action="eph">Voltar</button></div><div class="card"><label>Capacidade da garrafa (L)</label><input class="field" id="o2cap" type="number" min="1" value="5"><label>Pressão indicada (bar)</label><input class="field" id="o2press" type="number" min="0" value="200"><label>Débito (L/min)</label><input class="field" id="o2flow" type="number" min="0.1" step="0.1" value="15"><button class="primary" style="width:100%" data-action="calcO2">Calcular autonomia</button><div id="o2result" class="coords" aria-live="polite">Introduz os valores e calcula.</div></div><p class="muted">Estimativa teórica: capacidade × pressão ÷ débito. Confirma sempre o manómetro, a garrafa, o dispositivo e os procedimentos em vigor.</p>`}
function calcO2(){const c=+document.getElementById('o2cap').value,p=+document.getElementById('o2press').value,f=+document.getElementById('o2flow').value;const out=document.getElementById('o2result');if(!(c>0&&p>0&&f>0)){out.textContent='Verifica os valores introduzidos.';return}const mins=c*p/f,fmt=m=>`${Math.floor(m/60)} h ${Math.floor(m%60)} min`;out.innerHTML=`<b>Autonomia teórica estimada: ${fmt(mins)}</b><br>Volume teórico: ${(c*p).toFixed(0)} L`}

function ephHome(){currentView='eph';setActive('');content.innerHTML=`<div class="sectionhead"><div><p class="eyebrow">Emergência Pré-Hospitalar</p><h1 class="heading">Emergência Pré-Hospitalar</h1></div><div style="display:flex;gap:6px"><button class="back" data-action="back">Voltar</button><button class="back" data-action="home">Início</button></div></div><p class="intro">Escolhe a área de consulta.</p><div class="grid">${tile('Adulto','Área de apoio pré-hospitalar adulto','adult','ephadult')}${tile('Pediátrico','Área de apoio pré-hospitalar pediátrico','pediatric','ephped')}${tile('Hospitais de Evacuação','Distância rodoviária e navegação','hospital','ephhospitals')}${tile('Calculadora de Oxigénio','Autonomia estimada da garrafa','oxygen','oxygen')}${tile('Triagem Multivítimas','Triagem primária INEM — adulto e pediátrico','users','triage')}</div><p class="muted" style="margin-top:14px">Ferramenta de apoio. A escolha do destino deve respeitar a orientação do CODU e os critérios de encaminhamento aplicáveis.</p>`}
function triageView(){currentView='triage';setActive('');const table=(title,subtitle,headers,rows,source)=>`<div class="card" style="margin:12px 0"><h3 style="margin:0 0 5px">${title}</h3><p class="muted" style="margin:0 0 10px">${subtitle}</p><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px;min-width:440px"><thead><tr style="background:#f3f4f6;text-align:left">${headers.map(h=>`<th style="padding:9px;border-bottom:1px solid #ddd">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td style="padding:9px;border-bottom:1px solid #eee;vertical-align:top;${i===0?'font-weight:700;':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="muted" style="font-size:11px;margin:9px 0 0">Fonte: ${source}</p></div>`;const p1='<b style="color:#c51624">P1 — VERMELHO</b>',p2='<b style="color:#a87900">P2 — AMARELO</b>',p3='<b style="color:#4d8b20">P3 — VERDE</b>',p0='<b style="color:#222">P0 — PRETO</b>';content.innerHTML=`<div class="sectionhead"><div><p class="eyebrow">Emergência Pré-Hospitalar</p><h1 class="heading">Triagem Multivítimas</h1></div><div style="display:flex;gap:6px"><button class="back" data-action="eph">Voltar</button><button class="back" data-action="home">Início</button></div></div><div class="card" style="border-left:4px solid #b5121b"><b>Método de triagem INEM</b><p class="muted" style="margin:6px 0 0">Tabelas de consulta rápida construídas a partir dos critérios dos fluxogramas de Triagem Primária do INEM. Não correspondem ao método START. Aplicar apenas em situação de exceção, sob coordenação e de acordo com os procedimentos em vigor. A tabela apoia a consulta; não substitui formação, avaliação clínica nem o protocolo operacional.</p></div>${table('Categorias de prioridade','Identificação rápida por cor e gravidade.',['Prioridade','Significado','Ação geral'],[[p1,'Vítima emergente','Necessita de intervenção/evacuação prioritária.'],[p2,'Vítima grave','Necessita de cuidados e evacuação após P1.'],[p3,'Vítima não grave','Deambula ou apresenta critérios de menor gravidade; encaminhar para área definida.'],[p0,'Morto','Sem sinais de vida após abertura/permeabilização da via aérea, conforme algoritmo.']],'Manual de Operações das Equipas de Emergência Pré-Hospitalar, pp. 29–30 (março 2024).')}
<h2 class="heading" style="font-size:19px;margin:20px 0 8px">1. Triagem primária — adulto</h2><p class="muted">Seguir a sequência de cima para baixo. A primeira condição encontrada determina a prioridade.</p>${table('Tabela de decisão — adulto','Aplicável ao fluxograma de adulto.',['Passo','Avaliação / critério','Resultado'],[['1 — Deambulação','A vítima anda?','Se sim: verificar se está ferida. Se não estiver ferida: área de receção de sobreviventes. Se estiver ferida: '+p3+'. Se não anda: avançar para respiração.'],['2 — Respiração','Não respira?','Permeabilizar a via aérea e reavaliar. Se continuar sem respirar: '+p0+'. Se iniciar respiração: '+p1+'.'],['3 — Frequência respiratória','FR inferior a 10 ou superior a 30 ciclos/min?','Se sim: '+p1+'. Se FR entre 10 e 29 ciclos/min: avaliar FC.'],['4 — Frequência cardíaca','FC igual ou superior a 120 batimentos/min?','Se sim: '+p1+'. Se FC inferior a 120 batimentos/min: '+p2+'.']],'Manual de Operações das Equipas de Emergência Pré-Hospitalar, p. 30 (março 2024).')}
<h2 class="heading" style="font-size:19px;margin:20px 0 8px">2. Triagem primária — pediátrica</h2><p class="muted">Selecionar o grupo pelo tamanho e/ou peso estimado indicado no manual. Não misturar limiares entre grupos.</p>${table('Criança equivalente a >5 anos','100–140 cm ou 19–32 kg.',['Passo','Avaliação / critério','Resultado'],[['1 — Deambulação','A vítima anda?','Se sim: '+p3+'. Se não: avaliar respiração.'],['2 — Respiração','Não respira?','Permeabilizar a via aérea e reavaliar. Se continuar sem respirar: '+p0+'. Se iniciar respiração: '+p1+'.'],['3 — Frequência respiratória','FR inferior a 10 ou superior a 30 ciclos/min?','Se sim: '+p1+'. Se FR entre 10 e 30 ciclos/min: avaliar TPC.'],['4 — TPC','TPC inferior a 2 segundos?','Se sim: '+p2+'. Se não: avaliar FC.'],['5 — Frequência cardíaca','FC inferior a 70 ou superior a 140 batimentos/min?','Se sim: '+p1+'. Se FC entre 70 e 140 batimentos/min: '+p2+'.']],'Manual de Operações das Equipas de Emergência Pré-Hospitalar, p. 31 (março 2024).')}
${table('Criança equivalente a 2–5 anos','80–100 cm ou 11–18 kg.',['Passo','Avaliação / critério','Resultado'],[['1 — Estado / mobilidade','Está alerta, anda e move os membros?','Se sim: '+p3+'. Se não: avaliar respiração.'],['2 — Respiração','Não respira?','Permeabilizar a via aérea e reavaliar. Se continuar sem respirar: '+p0+'. Se iniciar respiração: '+p1+'.'],['3 — Frequência respiratória','FR inferior a 15 ou superior a 40 ciclos/min?','Se sim: '+p1+'. Se FR entre 15 e 40 ciclos/min: avaliar TPC.'],['4 — TPC','TPC inferior a 2 segundos?','Se sim: '+p2+'. Se não: avaliar FC.'],['5 — Frequência cardíaca','FC inferior a 80 ou superior a 160 batimentos/min?','Se sim: '+p1+'. Se FC entre 80 e 160 batimentos/min: '+p2+'.']],'Manual de Operações das Equipas de Emergência Pré-Hospitalar, p. 32 (março 2024).')}
${table('Criança equivalente a <2 anos','50–80 cm ou 3–10 kg.',['Passo','Avaliação / critério','Resultado'],[['1 — Estado / mobilidade','Está alerta, anda e move os membros?','Se sim: '+p3+'. Se não: avaliar respiração.'],['2 — Respiração','Não respira?','Permeabilizar a via aérea e reavaliar. Se continuar sem respirar: '+p0+'. Se iniciar respiração: '+p1+'.'],['3 — Frequência respiratória','FR inferior a 20 ou superior a 50 ciclos/min?','Se sim: '+p1+'. Se FR entre 20 e 50 ciclos/min: avaliar TPC.'],['4 — TPC','TPC inferior a 2 segundos?','Se sim: '+p2+'. Se não: avaliar FC.'],['5 — Frequência cardíaca','FC inferior a 90 ou superior a 180 batimentos/min?','Se sim: '+p1+'. Se FC entre 90 e 180 batimentos/min: '+p2+'.']],'Manual de Operações das Equipas de Emergência Pré-Hospitalar, p. 33 (março 2024).')}
<h2 class="heading" style="font-size:19px;margin:20px 0 8px">3. Triagem secundária — TRTS</h2><p class="muted">A triagem secundária é contínua e mais detalhada. O manual INEM indica a utilização do Triage Revised Trauma Score (TRTS), somando as pontuações codificadas das três variáveis fisiológicas.</p>${table('Parâmetros a avaliar','Registar os valores observados em cada reavaliação.',['Parâmetro','O que avaliar / registar','Observações'],[['Frequência respiratória (FR)','Ciclos respiratórios por minuto','Registar valor medido e hora.'],['Pressão arterial sistólica (PAS)','Valor em mmHg','Registar valor medido e hora.'],['Estado de consciência — ECG','Pontuação na Escala de Coma de Glasgow','Registar pontuação e alterações do estado neurológico.']],'Manual de Operações das Equipas de Emergência Pré-Hospitalar, pp. 33–34 (março 2024).')}
${table('Interpretação da pontuação TRTS','A pontuação total resulta da soma das três variáveis codificadas de 0 a 4 (total 0–12).',['Pontuação total','Prioridade'],[['1 a 10',p1],['11',p2],['12',p3],['0',p0]],'Manual de Operações das Equipas de Emergência Pré-Hospitalar, p. 34 (março 2024).')}<div class="card" style="margin:12px 0"><h3 style="margin-top:0">Registo e reavaliação da vítima</h3><p>Na triagem secundária, manter identificação/número da vítima, prioridade atribuída, hora e evolução, parâmetros avaliados, cuidados/intervenções efetuados, destino e hora de evacuação. Atualizar a prioridade se a condição se alterar e comunicar a alteração à coordenação.</p><p class="muted" style="font-size:11px">Nota: esta tabela resume os elementos descritos no manual. Não inclui os critérios de conversão individual de FR, PAS e Glasgow para a pontuação TRTS, pelo que não deve ser usada para calcular automaticamente o score sem a tabela oficial e formação específica.</p></div><p class="muted">A triagem é dinâmica. Reavaliar as vítimas e seguir sempre a coordenação do teatro de operações, os protocolos em vigor e as orientações do INEM/CODU.</p>`}

function ephHospitalsView(){currentView='ephhospitals';setActive('');content.innerHTML=`<div class="sectionhead"><div><p class="eyebrow">Emergência Pré-Hospitalar</p><h1 class="heading">Hospitais de Evacuação</h1></div><button class="back" data-action="eph">Voltar</button></div><p class="intro">Distâncias rodoviárias estimadas a partir da posição GPS atual. Seleciona um hospital para abrir o Google Maps com a rota de condução.</p><button class="primary positionbtn" data-action="refreshhospitals">⌖ Atualizar posição e distâncias</button><div id="hospitalstatus" class="muted" style="margin-bottom:12px">A obter posição GPS…</div><div id="hospitallist" class="list">${ephHospitals.map((h,i)=>`<button class="rowbtn" data-hospital="${i}"><span class="num">${i+1}</span><span class="rowmain"><strong>${h.name}</strong><small id="hospitaldistance${i}">A calcular distância rodoviária…</small></span><span class="chev">›</span></button>`).join('')}</div><p class="muted" style="margin-top:14px">As distâncias são calculadas por um serviço de rotas online e podem variar. O Google Maps seleciona a melhor rota disponível, incluindo autoestradas e portagens quando forem adequadas. Requer GPS e Internet.</p>`;refreshHospitalDistances()}
function openHospital(index){const h=ephHospitals[index];if(!h)return;const url=`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(h.address)}&travelmode=driving`;window.open(url,'_blank','noopener')}
function refreshHospitalDistances(){const status=document.getElementById('hospitalstatus');if(!navigator.geolocation){if(status)status.textContent='Este navegador não disponibiliza GPS.';return}if(status)status.textContent='A obter posição GPS…';navigator.geolocation.getCurrentPosition(async pos=>{const {latitude:lat,longitude:lon}=pos.coords;if(status)status.textContent=`Posição obtida (precisão aproximada ±${Math.round(pos.coords.accuracy)} m). A calcular rotas…`;await Promise.all(ephHospitals.map(async(h,i)=>{const el=document.getElementById('hospitaldistance'+i);if(!el)return;try{const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${lon},${lat};${h.lon},${h.lat}?overview=false`);if(!r.ok)throw Error();const d=await r.json();if(d.code!=='Ok'||!d.routes?.length)throw Error();el.textContent=`${(d.routes[0].distance/1000).toFixed(1).replace('.',',')} km por estrada · tocar para navegar`}catch(e){el.textContent='Distância indisponível · tocar para abrir Google Maps'}}));if(status)status.textContent='Distâncias rodoviárias estimadas; confirma sempre a rota no Google Maps.'},err=>{if(status)status.textContent=err.code===1?'Permite a localização nas definições para calcular as distâncias.':'Não foi possível obter GPS. Tenta atualizar a posição.'},{enableHighAccuracy:true,timeout:20000,maximumAge:10000})}

function contactsView(){currentView='contacts';setActive('');const contacts=[['Bombeiros do Concelho de Belmonte','275910090'],['CODU — Dados','800203264'],['CODU — Triagem','800500117'],['CDOS da Guarda','271210820'],['CDOS de Castelo Branco','272337733'],['GNR Belmonte','275910020'],['GNR Caria','275476141']];content.innerHTML=`<div class="sectionhead"><div><p class="eyebrow">Apoio operacional</p><h1 class="heading">Contactos Úteis</h1></div><div style="display:flex;gap:6px"><button class="back" data-action="home">Início</button></div></div><p class="intro">Contactos rápidos para uso operacional. Confirma periodicamente os números junto das entidades responsáveis.</p><div class="list">${contacts.map((c,i)=>`<div class="rowbtn"><span class="num">${icons.phone}</span><span class="rowmain"><strong>${c[0]}</strong><small>${c[1]}</small></span><a class="primary" style="padding:10px" href="tel:${c[1]}">Ligar</a><button class="secondary" data-copy="${c[1]}">Copiar</button></div>`).join('')}</div><p class="muted" style="margin-top:12px">Número do CDOS de Castelo Branco atualizado conforme confirmação: 272 337 733.</p>`}
const parentView={detail:'list',docs:'eph',hydrantphoto:'detail',dangerous:'home',oxygen:'eph',list:'hydrants',hydrants:'home',map:'cartography',cartography:'home',position:'home',eph:'home',ephhospitals:'eph',triage:'eph',contacts:'home',placeholder:'home'};
function goBack(){const target=parentView[currentView]||'home';if(target==='home')home();else if(target==='hydrants')hydrants();else if(target==='list')list();else if(target==='cartography')cartography();else if(target==='eph')ephHome();else home()}

function placeholder(title,desc){currentView='placeholder';setActive('');content.innerHTML=`<div class="sectionhead"><div><p class="eyebrow">Módulo</p><h1 class="heading">${title}</h1></div><div style="display:flex;gap:6px"><button class="back" data-action="back">Voltar</button><button class="back" data-action="home">Início</button></div></div><div class="placeholder"><div class="ico" style="width:48px;height:48px;border-radius:14px;background:#fff0f0;color:var(--red);display:grid;place-items:center">${(title==='Equipamentos'?icons.equipment:title==='Viaturas'?icons.truck:title==='Hidrantes Urbanos'?icons.urbanHydrant:icons.gear)}</div><strong>${title}</strong><p>${desc}</p><p>Esta secção está preparada para receber informação numa próxima atualização.</p><button class="primary" style="margin:auto" data-action="home">Voltar ao início</button></div>`}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.style.display='block';setTimeout(()=>el.style.display='none',2200)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){const a=b.dataset.action;if(a==='home')home();if(a==='back')goBack();if(a==='contacts')contactsView();if(a==='eph')ephHome();if(a==='ephhospitals')ephHospitalsView();if(a==='triage')triageView();if(a==='ephadult')adultDocs();if(a==='ephped')pedDocs();if(a==='dangerous')dangerousGoods();if(a==='searchDG')searchDangerous();if(a==='openDangerManual')openDangerManual();if(a==='manualBack'){dangerousGoods();const b=document.getElementById('dgResults');if(b)b.innerHTML=window._dangerSaved||lastDangerHTML;}if(a==='oxygen')oxygenCalc();if(a==='hydrantphoto')hydrantPhoto(Number(b.dataset.hydrant));if(a==='calcO2')calcO2();if(a==='refreshhospitals')refreshHospitalDistances();if(a==='position')positionView();if(a==='getposition')getPosition();if(a==='compass')enableCompass();if(a==='copygps'){if(currentPosition){const u=toUTM(currentPosition.lat,currentPosition.lon);const txt=`Lat ${toDMS(currentPosition.lat,true)}, Lon ${toDMS(currentPosition.lon,false)} | Decimal ${currentPosition.lat.toFixed(6)}, ${currentPosition.lon.toFixed(6)} | UTM ${u.zone}${u.band} E ${u.easting} N ${u.northing}`;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>toast('Coordenadas copiadas.')).catch(()=>toast(txt));else toast(txt)}else toast('Obtém primeiro a tua posição.')}if(a==='sharegps'){if(!currentPosition){toast('Obtém primeiro a tua posição.');getPosition()}else{const u=toUTM(currentPosition.lat,currentPosition.lon);const txt=`Minha posição CBV BELMONTE\nLatitude: ${toDMS(currentPosition.lat,true)}\nLongitude: ${toDMS(currentPosition.lon,false)}\nDecimal: ${currentPosition.lat.toFixed(6)}, ${currentPosition.lon.toFixed(6)}\nUTM: Zona ${u.zone}${u.band} E ${u.easting} m N ${u.northing} m\nGoogle Maps: https://www.google.com/maps?q=${currentPosition.lat},${currentPosition.lon}`;if(navigator.share)navigator.share({title:'Minha posição — CBV BELMONTE',text:txt}).catch(()=>{});else if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>toast('Localização copiada para partilhar.')).catch(()=>toast(txt));else toast(txt)}}if(a==='navigatecurrent'){if(currentPosition)window.open(`https://www.google.com/maps?q=${currentPosition.lat},${currentPosition.lon}`,'_blank','noopener');else toast('Obtém primeiro a tua posição.')}if(a==='hydrants')hydrants();if(a==='list')list();if(a==='map')mapView();if(a==='urban')placeholder('Hidrantes Urbanos','A lista de hidrantes urbanos será adicionada quando os dados estiverem disponíveis.');if(a==='cartography')cartography();if(a==='zoomall'&&cartoMap){cartoMap.setView([40.335,-7.335],11);setTimeout(()=>cartoMap.invalidateSize(),80)}if(a==='expandmap'){const wrap=document.getElementById('cartomapwrap');const btn=wrap?.querySelector('[data-action=expandmap]');if(wrap){const expanded=wrap.classList.toggle('expanded');document.body.classList.toggle('map-expanded',expanded);if(btn){btn.textContent=expanded?'Reduzir mapa ✕':'Expandir mapa ⛶';btn.setAttribute('aria-expanded',String(expanded))}setTimeout(()=>cartoMap?.invalidateSize(),180)}}if(a==='refreshcarto'){const st=document.getElementById('cartostatus');if(st)st.textContent='A atualizar os limites de freguesia. Esta operação requer Internet.';loadOfficialBoundaries(true);}return}const h=e.target.closest('[data-hospital]');if(h){openHospital(Number(h.dataset.hospital));return}const p=e.target.closest('[data-point]');if(p){detail(p.dataset.point);return}const c=e.target.closest('[data-copy]');if(c){const value=c.dataset.copy;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(value).then(()=>toast('Coordenadas copiadas.')).catch(()=>toast(value));else toast(value)}});
document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.nav==='home')home();if(b.dataset.nav==='hydrants')hydrants();if(b.dataset.nav==='map')cartography()}));window.addEventListener('open-point',e=>detail(e.detail));home();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
