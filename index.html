<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b5121b"><meta name="description" content="CBV Belmonte — Aplicação de apoio à decisão">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<title>CBV BELMONTE</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root{--red:#b5121b;--red2:#8f0c14;--ink:#20242a;--muted:#68717c;--paper:#f3f4f6;--white:#fff;--line:#e3e5e8;--shadow:0 8px 24px #161b2210}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100dvh;background:var(--paper);padding-bottom:90px}.top{background:linear-gradient(140deg,var(--red),var(--red2));color:white;padding:calc(18px + env(safe-area-inset-top)) 20px 24px;border-radius:0 0 26px 26px;box-shadow:var(--shadow)}.topline{display:flex;align-items:center;gap:13px}.crest{width:54px;height:54px;border:2px solid #ffffff9c;border-radius:16px;display:grid;place-items:center;background:#ffffff14;flex-shrink:0}.crest svg{width:34px;height:34px}.brand{font-weight:900;letter-spacing:1.2px;font-size:21px;line-height:1.1}.subtitle{font-size:12px;opacity:.9;margin-top:5px}.top p{font-size:13px;opacity:.92;margin:19px 0 0}.content{padding:20px 16px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;font-weight:800;color:var(--red);margin:0 0 9px}.heading{font-size:23px;line-height:1.2;margin:0 0 7px;font-weight:850}.intro{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{background:white;border:1px solid var(--line);border-radius:18px;padding:17px 15px;text-align:left;min-height:140px;box-shadow:var(--shadow);color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;gap:9px}.tile:active,.rowbtn:active{transform:scale(.99)}.tile .ico{width:43px;height:43px;border-radius:13px;display:grid;place-items:center;background:#fff0f0;color:var(--red)}.tile .ico svg{width:25px;height:25px}.tile strong{font-size:15px}.tile small{font-size:12px;color:var(--muted);line-height:1.35}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.back{border:1px solid var(--line);background:white;color:var(--ink);border-radius:12px;padding:10px 12px;font-weight:700}.search{width:100%;border:1px solid var(--line);border-radius:13px;background:white;padding:13px 14px;outline:none;margin:2px 0 14px}.search:focus{border-color:var(--red);box-shadow:0 0 0 3px #b5121b16}.list{display:grid;gap:10px}.rowbtn{border:1px solid var(--line);background:white;border-radius:15px;padding:14px;display:flex;align-items:center;gap:12px;text-align:left;color:var(--ink);width:100%;box-shadow:var(--shadow)}.num{width:42px;height:42px;flex-shrink:0;border-radius:13px;background:var(--red);color:white;font-weight:900;display:grid;place-items:center}.rowmain{flex:1;min-width:0}.rowmain strong{display:block;font-size:14px}.rowmain small{display:block;color:var(--muted);font-size:12px;margin-top:4px;line-height:1.35}.chev{color:var(--muted);font-size:22px}.mapwrap{background:white;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px}.maptools{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-size:13px;font-weight:750}.map{height:330px;width:100%;background:#e7e9eb}.mapnote{padding:10px 14px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow);margin-bottom:12px}.detailnum{display:inline-grid;place-items:center;background:#fff0f0;color:var(--red);font-weight:900;border-radius:12px;width:48px;height:48px;margin-bottom:12px}.detailtitle{font-size:21px;margin:0 0 6px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.coords{background:#f5f6f7;border-radius:12px;padding:12px;font-size:13px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;margin:13px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.primary,.secondary{border-radius:12px;padding:13px 12px;font-weight:800;border:0;text-align:center;text-decoration:none;display:flex;justify-content:center;align-items:center;gap:7px}.primary{background:var(--red);color:white}.secondary{background:#fff0f0;color:var(--red);border:1px solid #f0d2d4}.placeholder{background:white;border:1px dashed #c8cbd0;border-radius:18px;padding:23px;text-align:center}.placeholder .ico{margin:0 auto 12px}.placeholder p{color:var(--muted);font-size:13px;line-height:1.5}.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:500}.bottominner{width:100%;max-width:720px;display:flex;gap:8px}.navbtn{flex:1;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:750;padding:7px 4px;border-radius:12px;display:grid;justify-items:center;gap:4px}.navbtn svg{width:21px;height:21px}.navbtn.active{color:var(--red);background:#fff0f0}.toast{position:fixed;left:20px;right:20px;bottom:90px;background:#20242a;color:white;border-radius:12px;padding:12px 14px;font-size:13px;display:none;z-index:999}.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}.leaflet-popup-content-wrapper{border-radius:12px}.leaflet-popup-content{font-family:system-ui,sans-serif;line-height:1.5}@media(min-width:600px){.content{padding:24px}.top{padding-left:26px;padding-right:26px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.map{height:410px}}
</style>
</head>
<body><div class="app">
<header class="top"><div class="topline"><div class="crest" aria-label="Espaço reservado para o emblema oficial"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3"><path d="M32 5 52 13v17c0 14-9 23-20 29C21 53 12 44 12 30V13L32 5Z"/><path d="M32 17c-1 8-9 10-9 19a9 9 0 0 0 18 0c0-5-3-8-5-11 0 5-3 6-4 7 1-6-1-10 0-15Z"/></svg></div><div><div class="brand">CBV BELMONTE</div><div class="subtitle">Aplicação de apoio à decisão</div></div></div><p>Informação operacional, organizada e acessível no terreno.</p></header>
<main id="content" class="content" aria-live="polite"></main>
</div><nav class="bottom"><div class="bottominner"><button class="navbtn active" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1Z"/></svg>Início</button><button class="navbtn" data-nav="hydrants"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 21V9a5 5 0 0 1 10 0v12M5 12h14M9 4V2h6v2M4 16H2m20 0h-2"/></svg>Hidrantes</button><button class="navbtn" data-nav="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Z"/><path d="M9 3v15m6-12v15"/></svg>Mapa</button></div></nav><div class="toast" id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const points=[
{id:1,name:'EM 571',lat:40.369111,lon:-7.332749},
{id:2,name:'Quinta da Ribeira',lat:40.341720,lon:-7.323897},
{id:3,name:'EM 563',lat:40.337889,lon:-7.291794},
{id:4,name:'EM 1051 — Quinta das Pereiras',lat:40.330615,lon:-7.377719},
{id:5,name:'EM 1051 — Malpique',lat:40.313732,lon:-7.362837},
{id:6,name:'EN 18-3',lat:40.310179,lon:-7.316784},
{id:7,name:'EM 570',lat:40.279867,lon:-7.339817}
];
const content=document.getElementById('content');let currentMap=null;let currentView='home';let selectedPoint=null;let query='';
const icons={hydrants:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 21V9a5 5 0 0 1 10 0v12M5 12h14M9 4V2h6v2M4 16H2m20 0h-2"/></svg>',truck:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h11v12H3zM14 10h4l3 4v4h-7z"/><circle cx="7" cy="19" r="2"/><circle cx="18" cy="19" r="2"/></svg>',map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Z"/><path d="M9 3v15m6-12v15"/></svg>',gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.6a8 8 0 0 1-1.8 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.8-1l-1.7.6-1.4-2.4L7.1 15a8 8 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.6a8 8 0 0 1 1.8-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.8 1l1.7-.6 1.4 2.4-1.4 1.1a8 8 0 0 1-.1 2Z" transform="translate(-1 -1)"/></svg>',chevron:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>'};
function tile(title,desc,icon,action){return `<button class="tile" data-action="${action}"><span class="ico">${icons[icon]||icons.gear}</span><strong>${title}</strong><small>${desc}</small></button>`}
function setActive(nav){document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.nav===nav))}
function home(){currentView='home';setActive('home');content.innerHTML=`<p class="eyebrow">Painel principal</p><h1 class="heading">Bem-vindo à aplicação</h1><p class="intro">Acede rapidamente aos recursos de apoio operacional dos Bombeiros do Concelho de Belmonte.</p><div class="grid">${tile('Hidrantes','Rede de regadio e rede urbana','hydrants','hydrants')}${tile('Viaturas','Frota e informação operacional','truck','vehicles')}${tile('Cartografia','Mapas e informação territorial','map','cartography')}${tile('Equipamentos','Consulta de equipamentos','gear','equipment')}</div><div class="card" style="margin-top:16px"><p class="eyebrow">Disponível nesta versão</p><strong>Rede de Regadio</strong><p class="muted" style="margin-bottom:0">7 hidrantes registados, com coordenadas e acesso à navegação. As restantes secções ficam preparadas para acrescentar conteúdo.</p></div>`}
function hydrants(){currentView='hydrants';setActive('hydrants');content.innerHTML=`<div class="sectionhead"><div><p class="eyebrow">Hidrantes</p><h1 class="heading">Escolher rede</h1></div><button class="back" data-action="home">Início</button></div><p class="intro">Seleciona a rede que pretendes consultar.</p><div class="grid">${tile('Rede de Regadio','7 hidrantes com localização','hydrants','list')}${tile('Hidrantes Urbanos','Preparado para adicionar pontos','hydrants','urban')}</div>`}
function pointRows(){let filtered=points.filter(p=>(`hidrante ${p.id} ${p.name}`).toLowerCase().includes(query.toLowerCase()));return filtered.length?filtered.map(p=>`<button class="rowbtn" data-point="${p.id}"><span class="num">${p.id}</span><span class="rowmain"><strong>Hidrante ${p.id} — ${p.name}</strong><small>${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}</small></span><span class="chev">›</span></button>`).join(''):'<div class="empty">Não foram encontrados hidrantes.</div>'}
function list(){currentView='list';setActive('hydrants');content.innerHTML=`<div class="sectionhead"><div><p class="eyebrow">Hidrantes / Rede de Regadio</p><h1 class="heading">7 pontos registados</h1></div><button class="back" data-action="hydrants">Voltar</button></div><input class="search" id="search" placeholder="Pesquisar por número ou local…" value="${escapeHtml(query)}" aria-label="Pesquisar hidrantes"><div class="list" id="pointlist">${pointRows()}</div>`;document.getElementById('search').addEventListener('input',e=>{query=e.target.value;document.getElementById('pointlist').innerHTML=pointRows()})}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function detail(id){const p=points.find(x=>x.id===Number(id));if(!p)return;selectedPoint=p;currentView='detail';setActive('hydrants');const gmaps=`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}`;const apple=`https://maps.apple.com/?daddr=${p.lat},${p.lon}`;content.innerHTML=`<div class="sectionhead"><div><p class="eyebrow">Rede de Regadio</p><h1 class="heading">Ficha do hidrante</h1></div><button class="back" data-action="list">Voltar</button></div><div class="card"><span class="detailnum">${p.id}</span><h2 class="detailtitle">Hidrante ${p.id}</h2><p class="muted" style="margin:0">${escapeHtml(p.name)}</p><div class="coords"><strong>Latitude:</strong> ${p.lat.toFixed(6)}<br><strong>Longitude:</strong> ${p.lon.toFixed(6)}</div><div class="actions"><a class="primary" href="${gmaps}" target="_blank" rel="noopener">Abrir navegação ↗</a><button class="secondary" data-copy="${p.lat}, ${p.lon}">Copiar coordenadas</button></div><p class="muted" style="margin:14px 0 0">Confirma sempre a localização e as condições de acesso no terreno.</p></div><div class="card"><strong>Localização no mapa</strong><div id="detailmap" class="map" style="margin-top:12px;border-radius:12px"></div></div>`;setTimeout(()=>makeMap('detailmap',[p],14),60)}
function makeMap(elementId,data,zoom){const el=document.getElementById(elementId);if(!el)return;if(currentMap){currentMap.remove();currentMap=null}if(typeof L==='undefined'){el.innerHTML='<div class="empty">Não foi possível carregar o mapa. Verifica a ligação à Internet.</div>';return}const map=L.map(el).setView([40.335,-7.335],zoom||11);currentMap=map;L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);data.forEach(p=>L.marker([p.lat,p.lon]).addTo(map).bindPopup(`<strong>Hidrante ${p.id}</strong><br>${escapeHtml(p.name)}<br><button onclick="window.dispatchEvent(new CustomEvent('open-point',{detail:${p.id}}))">Ver ficha</button>`));if(data.length>1)map.fitBounds(data.map(p=>[p.lat,p.lon]),{padding:[24,24]});setTimeout(()=>map.invalidateSize(),150)}
function mapView(){currentView='map';setActive('map');content.innerHTML=`<div class="sectionhead"><div><p class="eyebrow">Cartografia</p><h1 class="heading">Rede de Regadio</h1></div><button class="back" data-action="list">Ver lista</button></div><p class="intro">Consulta a localização dos sete hidrantes. Seleciona um marcador para abrir a respetiva ficha.</p><div class="mapwrap"><div class="maptools"><span>7 hidrantes no mapa</span><button class="back" data-action="list">Lista</button></div><div id="mainmap" class="map"></div><div class="mapnote">Mapa fornecido por OpenStreetMap. Requer ligação à Internet para carregar o mapa base.</div></div><div class="list">${points.slice(0,3).map(p=>`<button class="rowbtn" data-point="${p.id}"><span class="num">${p.id}</span><span class="rowmain"><strong>Hidrante ${p.id} — ${escapeHtml(p.name)}</strong><small>Ver coordenadas e navegar</small></span><span class="chev">›</span></button>`).join('')}<button class="secondary" data-action="list">Ver todos os hidrantes</button></div>`;setTimeout(()=>makeMap('mainmap',points,11),60)}
let cartoMap=null,cartoLayers={};
function cartography(){currentView='cartography';setActive('');content.innerHTML=`<div class="sectionhead"><div><p class="eyebrow">Cartografia operacional</p><h1 class="heading">Concelho de Belmonte</h1></div><button class="back" data-action="home">Início</button></div><p class="intro">Mapa de trabalho com camadas que podes ligar e desligar. Os elementos geográficos são carregados de fontes abertas e devem ser confirmados antes de uso operacional.</p><div class="card" style="padding:13px"><strong>Camadas do mapa</strong><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;font-size:13px"><label><input type="checkbox" data-layer="hydrants" checked> Hidrantes (7)</label><label><input type="checkbox" data-layer="motorway" checked> Autoestrada A23</label><label><input type="checkbox" data-layer="railway" checked> Linha ferroviária</label><label><input type="checkbox" data-layer="stations" checked> Estações e passagens</label><label><input type="checkbox" data-layer="boundaries" checked> Limites de freguesia*</label></div><p class="muted" style="margin:12px 0 0">*A camada administrativa pode não estar disponível na primeira carga. A23, ferrovia e pontos de passagem dependem de dados cartográficos abertos.</p></div><div class="mapwrap"><div class="maptools"><span>Belmonte — mapa operacional</span><button class="back" data-action="zoomall">Ver concelho</button></div><div id="cartomap" class="map" style="height:430px"></div><div class="mapnote">Base cartográfica © OpenStreetMap contributors. Requer Internet. Não utilizar como cartografia operacional certificada sem validação no terreno.</div></div><div class="card"><strong>Legenda e validação</strong><p class="muted">Vermelho: A23 · Laranja: ferrovia · Azul: hidrantes. Os limites de freguesia e os acessos devem ser confirmados com cartografia oficial e fontes das entidades responsáveis.</p><button class="secondary" data-action="list">Consultar os 7 hidrantes</button></div>`;setTimeout(initCartography,100)}
function initCartography(){const el=document.getElementById('cartomap');if(!el||typeof L==='undefined'){if(el)el.innerHTML='<div class="empty">O mapa não carregou. Verifica a ligação à Internet.</div>';return}if(cartoMap)cartoMap.remove();cartoMap=L.map(el).setView([40.335,-7.335],11);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(cartoMap);cartoLayers.hydrants=L.layerGroup(points.map(p=>L.circleMarker([p.lat,p.lon],{radius:7,color:'#0877b9',fillColor:'#0877b9',fillOpacity:.9}).bindPopup(`<strong>Hidrante ${p.id}</strong><br>${escapeHtml(p.name)}<br>${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}`))).addTo(cartoMap);['motorway','railway','stations','boundaries'].forEach(k=>cartoLayers[k]=L.layerGroup());document.querySelectorAll('[data-layer]').forEach(cb=>cb.addEventListener('change',()=>{const layer=cartoLayers[cb.dataset.layer];if(!layer)return;if(cb.checked)layer.addTo(cartoMap);else cartoMap.removeLayer(layer)}));loadCartoFeatures()}
async function loadCartoFeatures(){const bbox='40.24,-7.48,40.43,-7.20';const q=`[out:json][timeout:25];(way[highway=motorway](${bbox});way[railway=rail](${bbox});node[railway=station](${bbox});node[railway=halt](${bbox});node[railway=level_crossing](${bbox});node[railway=crossing](${bbox}););out geom;`;try{const r=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q));if(!r.ok)throw Error('Fonte indisponível');const data=await r.json();data.elements.forEach(e=>{if(e.type==='way'&&e.geometry){const coords=e.geometry.map(p=>[p.lat,p.lon]);if(e.tags?.highway==='motorway')L.polyline(coords,{color:'#b5121b',weight:5,opacity:.9}).bindPopup('Autoestrada — confirmar identificação do troço').addTo(cartoLayers.motorway);if(e.tags?.railway==='rail')L.polyline(coords,{color:'#e28a20',weight:4,dashArray:'8 5'}).bindPopup('Linha ferroviária').addTo(cartoLayers.railway)}else if(e.type==='node'&&e.lat&&e.lon){if(['station','halt'].includes(e.tags?.railway))L.circleMarker([e.lat,e.lon],{radius:6,color:'#e28a20',fillColor:'#fff',fillOpacity:1}).bindPopup(escapeHtml(e.tags?.name||'Estação ferroviária')).addTo(cartoLayers.stations);if(['level_crossing','crossing'].includes(e.tags?.railway))L.circleMarker([e.lat,e.lon],{radius:5,color:'#6d4c41',fillColor:'#fff',fillOpacity:1}).bindPopup('Passagem ferroviária registada em OpenStreetMap — confirmar em campo').addTo(cartoLayers.stations)}});document.querySelectorAll('[data-layer]').forEach(cb=>{if(cb.checked)cartoLayers[cb.dataset.layer]?.addTo(cartoMap)});toast('Camadas cartográficas carregadas.')}catch(err){toast('Não foi possível carregar todas as camadas.');console.warn(err)}}
function placeholder(title,desc){currentView='placeholder';setActive('');content.innerHTML=`<div class="sectionhead"><div><p class="eyebrow">Módulo</p><h1 class="heading">${title}</h1></div><button class="back" data-action="home">Início</button></div><div class="placeholder"><div class="ico" style="width:48px;height:48px;border-radius:14px;background:#fff0f0;color:var(--red);display:grid;place-items:center">${icons.gear}</div><strong>${title}</strong><p>${desc}</p><p>Esta secção está preparada para receber informação numa próxima atualização.</p><button class="primary" style="margin:auto" data-action="home">Voltar ao início</button></div>`}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.style.display='block';setTimeout(()=>el.style.display='none',2200)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){const a=b.dataset.action;if(a==='home')home();if(a==='hydrants')hydrants();if(a==='list')list();if(a==='map')mapView();if(a==='urban')placeholder('Hidrantes Urbanos','A lista de hidrantes urbanos será adicionada quando os dados estiverem disponíveis.');if(a==='vehicles')placeholder('Viaturas','Fichas de viaturas, fotografias, características e informação operacional.');if(a==='cartography')cartography();if(a==='zoomall'&&cartoMap)cartoMap.setView([40.335,-7.335],11);if(a==='equipment')placeholder('Equipamentos','Consulta de equipamentos e respetiva informação operacional.');return}const p=e.target.closest('[data-point]');if(p){detail(p.dataset.point);return}const c=e.target.closest('[data-copy]');if(c){const value=c.dataset.copy;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(value).then(()=>toast('Coordenadas copiadas.')).catch(()=>toast(value));else toast(value)}});
document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.nav==='home')home();if(b.dataset.nav==='hydrants')hydrants();if(b.dataset.nav==='map')mapView()}));window.addEventListener('open-point',e=>detail(e.detail));home();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
